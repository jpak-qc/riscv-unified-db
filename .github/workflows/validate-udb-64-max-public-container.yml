name: Validate udb-64-max with public UDB container

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  udb-64-max-vector-arch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: ghcr.io/riscv/udb:0.46
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Set up project dependencies with the container toolchain
        shell: bash
        run: |
          set -euo pipefail
          printf 'UDB_TOOLCHAIN_CONTAINER=0\n' > .toolchain-local
          ./bin/setup
      - name: Run udb-64-max vector arch-tests
        shell: bash
        run: |
          set -euo pipefail
          EXTENSIONS=Vx8,Vx16,Vx32,Vx64,Vls8,Vls16,Vls32,Vls64,Vf16,Vf32,Vf64 \
            JOBS=4 \
            BUILD_TYPE=debug \
            IGNOREUNDEFINED=YES \
            ./tools/test/run_udb_64_max_vector_arch_test.sh
