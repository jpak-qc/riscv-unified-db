name: Validate udb-64-max with public UDB container

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  udb-64-max-vector-arch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: ghcr.io/riscv/udb:0.46
    # GitHub-hosted runners cannot currently reach Sigstore's TUF CDN. Mise
    # still verifies the downloaded Ruby archive checksum.
    env:
      # .mise.toml's [hooks] table requires a post-2026.8 Mise release.
      MISE_VERSION: v2026.9.3
      MISE_RUBY_GITHUB_ATTESTATIONS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install native build dependency
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install --yes pkg-config
          elif command -v dnf >/dev/null; then
            dnf install --assumeyes pkgconf-pkg-config
          else
            echo "No supported package manager found to install pkg-config." >&2
            exit 1
          fi
      - name: Set up project dependencies with the container toolchain
        shell: bash
        run: |
          set -euo pipefail
          printf 'UDB_TOOLCHAIN_CONTAINER=0\n' > .toolchain-local
          # The public image ships an older Mise at the cache path used by
          # bin/mise.  The bootstrap wrapper only checks for file existence,
          # so remove that image-provided binary and install MISE_VERSION.
          rm -f "${XDG_CACHE_HOME:-$HOME/.cache}/mise/mise-2026.7.5"
          ./bin/setup
          "${XDG_CACHE_HOME:-$HOME/.cache}/mise/mise-2026.7.5" version
      - name: Run udb-64-max vector arch-tests
        shell: bash
        run: |
          set -euo pipefail
          EXTENSIONS=Vx8,Vx16,Vx32,Vx64,Vls8,Vls16,Vls32,Vls64,Vf16,Vf32,Vf64 \
            JOBS=4 \
            BUILD_TYPE=debug \
            IGNOREUNDEFINED=YES \
            ./tools/test/run_udb_64_max_vector_arch_test.sh
