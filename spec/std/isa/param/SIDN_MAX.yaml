$schema: param_schema.json#
kind: parameter
name: SIDN_MAX
long_name: Maximum implemented supervisor interrupt domain number
description: |
  The largest legal value of `msdcfg.SIDN`. A value of zero represents a single
  supervisor interrupt domain and makes the selector read-only zero.
schema:
  type: integer
  minimum: 0
  maximum: 63
definedBy:
  extension:
    name: Smsdia
