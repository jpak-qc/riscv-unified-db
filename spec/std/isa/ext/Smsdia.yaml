# yaml-language-server: $schema=../../../schemas/ext_schema.json

$schema: ext_schema.json#
kind: extension
name: Smsdia
long_name: Supervisor Domain Interrupt Assignment
description: |
  Smsdia selects the supervisor interrupt domain associated with the active
  supervisor domain. It adds `msdcfg.SIDN`, the `msideip`/`msideie` CSR pairs,
  and the machine supervisor-domain external interrupt (MSDEI).
type: privileged
versions:
  - version: "0.9.0"
    state: development
    repositories:
      - url: https://github.com/riscv/riscv-smmtt
        branch: v0.9.0
requirements:
  extension:
    allOf:
      - name: Smsd
      - name: Smaia
