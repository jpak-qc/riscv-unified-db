# yaml-language-server: $schema=../../../schemas/ext_schema.json

$schema: ext_schema.json#
kind: extension
name: Smmpt64
long_name: 64-bit Machine Memory Protection Table
description: |
  Smmpt64 defines the RV64, five-level memory protection table format for a
  64-bit supervisor physical address space. It is selected by `mmpt.MODE=3` and
  requires the root MPT to be 32 KiB aligned.
type: privileged
versions:
  - version: "0.9.0"
    state: development
    repositories:
      - url: https://github.com/riscv/riscv-smmtt
        branch: v0.9.0
requirements:
  allOf:
    - xlen: 64
    - extension:
        name: Smsd
