# yaml-language-server: $schema=../../../schemas/ext_schema.json

$schema: ext_schema.json#
kind: extension
name: Smqosid
long_name: Machine-mode Quality-of-Service Identifiers
description: |
  Smqosid defines the machine resource-management configuration CSR (`mrmcfg`)
  for the QoS identifiers attached to requests made with effective privilege
  mode M.
type: privileged
versions:
  - version: "0.9.0"
    state: development
    repositories:
      - url: https://github.com/riscv/riscv-smmtt
        branch: v0.9.0
requirements:
  extension:
    allOf:
      - name: Sm
      - name: Ssqosid
