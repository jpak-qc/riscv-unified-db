# yaml-language-server: $schema=../../../schemas/ext_schema.json

$schema: ext_schema.json#
kind: extension
name: Smmpt52
long_name: 52-bit Machine Memory Protection Table
description: |
  Smmpt52 defines the RV64, four-level memory protection table format for a
  52-bit supervisor physical address space. It is selected by `mmpt.MODE=2`.
type: privileged
versions:
  - version: "0.9.0"
    state: development
    repositories:
      - url: https://github.com/riscv/riscv-smmtt
        branch: v0.9.0
requirements:
  allOf:
    - xlen: 64
    - extension:
        name: Smsd
