# yaml-language-server: $schema=../../../schemas/ext_schema.json

$schema: ext_schema.json#
kind: extension
name: Smsdetrca
long_name: Supervisor Domain External Trace Allow Control
description: |
  Smsdetrca adds the per-supervisor-domain external-trace allow state
  (`msdcfg.SETA`). When external M-mode trace is disabled, this state controls
  whether modes less privileged than M may be externally traced.
type: privileged
versions:
  - version: "0.9.0"
    state: development
    repositories:
      - url: https://github.com/riscv/riscv-smmtt
        branch: v0.9.0
requirements:
  extension:
    name: Smsd
