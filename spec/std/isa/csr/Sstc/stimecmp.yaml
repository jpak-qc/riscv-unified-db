# yaml-language-server: $schema=../../../../schemas/csr_schema.json

$schema: csr_schema.json#
kind: csr
name: stimecmp
long_name: Supervisor Timer Compare
address: 0x14D
writable: true
priv_mode: S
length: 64
definedBy:
  extension:
    name: Sstc
description: |
  `stimecmp` controls the supervisor timer interrupt.  The timer interrupt is
  pending when the platform time is greater than or equal to this value.

  Accesses from privilege modes below M-mode raise an illegal-instruction
  exception when either `mcounteren.TM` or `menvcfg.STCE` is clear.
fields:
  VALUE:
    location: 63-0
    type: RW
    reset_value: UNDEFINED_LEGAL
    description: Supervisor timer compare value.
    sw_write(csr_value): |
      if (mode() != PrivilegeMode::M && CSR[mcounteren].TM == 1'b0) {
        raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
      }
      if (mode() != PrivilegeMode::M && CSR[menvcfg].STCE == 1'b0) {
        raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
      }
      set_stimecmp(csr_value.VALUE);
      return csr_value.VALUE;
sw_read(): |
  if (mode() != PrivilegeMode::M && CSR[mcounteren].TM == 1'b0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  if (mode() != PrivilegeMode::M && CSR[menvcfg].STCE == 1'b0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  return $bits(CSR[stimecmp]);
