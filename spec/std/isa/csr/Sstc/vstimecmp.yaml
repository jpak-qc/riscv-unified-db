# yaml-language-server: $schema=../../../../schemas/csr_schema.json

$schema: csr_schema.json#
kind: csr
name: vstimecmp
long_name: Virtual Supervisor Timer Compare
address: 0x24D
virtual_address: 0x14D
writable: true
priv_mode: VS
length: 64
definedBy:
  extension:
    allOf:
      - name: Sstc
      - name: H
description: |
  `vstimecmp` is the VS-mode view of `stimecmp`.  A guest access is enabled by
  both `menvcfg.STCE` and `henvcfg.STCE`.
fields:
  VALUE:
    location: 63-0
    type: RW
    reset_value: UNDEFINED_LEGAL
    description: Virtual supervisor timer compare value.
    sw_write(csr_value): |
      if (mode() != PrivilegeMode::M && CSR[menvcfg].STCE == 1'b0) {
        raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
      }
      if (mode() != PrivilegeMode::M && CSR[henvcfg].STCE == 1'b0) {
        raise(ExceptionCode::VirtualInstruction, mode(), $encoding);
      }
      set_vstimecmp(csr_value.VALUE - CSR[htimedelta].DELTA);
      return csr_value.VALUE;
sw_read(): |
  if (mode() != PrivilegeMode::M && CSR[menvcfg].STCE == 1'b0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  if (mode() != PrivilegeMode::M && CSR[henvcfg].STCE == 1'b0) {
    raise(ExceptionCode::VirtualInstruction, mode(), $encoding);
  }
  return $bits(CSR[vstimecmp]);
