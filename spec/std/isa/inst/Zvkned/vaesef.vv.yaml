# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vaesef.vv
long_name: Vector AES encryption final round
description: |
  Performs the final round of AES encryption on vector register vs2 using vector register vs1, storing results in vector register vd according to mask vm. This combines the shift rows, sub bytes, and add round key operations.
definedBy:
  extension:
    name: Zvkned
assembly: vd, vs2
encoding:
  match: 1010001-----00011010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  VectorState state = vector_state();
  if (state.sew != 32 || !vector_element_group_legal(state, 128, 4)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  for (U32 group = CSR[vstart].VALUE / 4; group < CSR[vl].VALUE / 4; group++) {
    U32 element = group * 4;
    Bits<128> result = crypto_aes_enc_final128(
      vector_read_eg128(vd, element), vector_read_eg128(vs2, element));
    vector_write_eg128(vd, element, result);
  }

  CSR[vstart].VALUE = 0;
