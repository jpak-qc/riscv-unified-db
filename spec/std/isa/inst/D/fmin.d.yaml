# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fmin.d
long_name: Floating-Point Minimum-Number Double-Precision
definedBy:
  extension:
    oneOf:
      - name: D
      - name: Zdinx
description: |
  The `fmin.d` instruction writes smaller of `fs1` and `fs2` to `fd`. For the purposes of this instruction,
  the value `-0.0` is considered to be less than the value `+0.0`. If both inputs are NaNs, the result is
  the canonical NaN. If only one operand is a NaN, the result is the non-NaN operand. Signaling NaN inputs
  set the invalid operation exception flag, even when the result is not NaN.
assembly: fd, fs1, fs2
encoding:
  match: 0010101----------000-----1010011
  variables:
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);

  Bits<64> dp_value_a = F[fs1];
  Bits<64> dp_value_b = F[fs2];

  if (is_dp_nan?(dp_value_a) || is_dp_nan?(dp_value_b)) {
    if (is_dp_signaling_nan?(dp_value_a) || is_dp_signaling_nan?(dp_value_b)) {
      set_fp_flag(FpFlag::NV);
    }
    if (is_dp_nan?(dp_value_a) && is_dp_nan?(dp_value_b)) {
      F[fd] = DP_CANONICAL_NAN;
    } else if (is_dp_nan?(dp_value_a)) {
      F[fd] = dp_value_b;
    } else {
      F[fd] = dp_value_a;
    }
  } else {
    Boolean sign_a = dp_value_a[63] == 1;
    Boolean sign_b = dp_value_b[63] == 1;
    Boolean a_lt_b;
    if (sign_a != sign_b) {
      a_lt_b = sign_a;
    } else {
      a_lt_b = (dp_value_a != dp_value_b) && (sign_a != (dp_value_a < dp_value_b));
    }
    F[fd] = a_lt_b ? dp_value_a : dp_value_b;
  }
  mark_f_state_dirty();
