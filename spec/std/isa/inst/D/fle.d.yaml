# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fle.d
long_name: Floating-Point Less Than or Equal Double-Precision
definedBy:
  extension:
    oneOf:
      - name: D
      - name: Zdinx
description: |
  The `fle.d` instruction writes 1 to `xd` if `fs1` is less than or equal to `fs2`, and 0 otherwise. It is defined
  analogously to its single-precision counterpart, but operates on double-precision operands.
assembly: xd, fs1, fs2
encoding:
  match: 1010001----------000-----1010011
  variables:
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);

  Bits<64> dp_value_a = F[fs1];
  Bits<64> dp_value_b = F[fs2];
  Bits<1> sign_a = dp_value_a[63];
  Bits<1> sign_b = dp_value_b[63];

  if (is_dp_nan?(dp_value_a) || is_dp_nan?(dp_value_b)) {
    set_fp_flag(FpFlag::NV);
    X[xd] = 0;
  } else {
    if (sign_a != sign_b) {
      X[xd] = (
        (sign_a == 1) ||
        ((dp_value_a[62:0] | dp_value_b[62:0]) == 0)
      ) ? 1 : 0;
    } else {
      X[xd] = (
        (dp_value_a == dp_value_b) ||
        (sign_a ^ ((dp_value_a < dp_value_b) ? 1 : 0)) == 1
      ) ? 1 : 0;
    }
  }
