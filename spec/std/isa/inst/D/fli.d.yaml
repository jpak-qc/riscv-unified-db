# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fli.d
long_name: Floating-Point Load Immediate Double-Precision
description: |
  The `fli.d` instruction instruction loads one of 32 double-precision floating-point constants, encoded in the `xs1`
  field, into floating-point register `fd`. `fli.d` is encoded like `fli.s`, but with `fmt` set to D.
definedBy:
  extension:
    allOf:
      - name: D
      - name: Zfa
assembly: fd, xs1
encoding:
  match: 111100100001-----000-----1010011
  variables:
    - name: xs1
      location: 19-15
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  Bits<64> imm;
  if      (xs1 == 5'b00000) { imm = 64'hBFF0000000000000; } # -1.0
  else if (xs1 == 5'b00001) { imm = 64'h0010000000000000; } # min pos normal
  else if (xs1 == 5'b00010) { imm = 64'h3EF0000000000000; } # 2^-16
  else if (xs1 == 5'b00011) { imm = 64'h3F00000000000000; } # 2^-15
  else if (xs1 == 5'b00100) { imm = 64'h3F70000000000000; } # 2^-8
  else if (xs1 == 5'b00101) { imm = 64'h3F80000000000000; } # 2^-7
  else if (xs1 == 5'b00110) { imm = 64'h3FB0000000000000; } # 0.0625 (2^-4)
  else if (xs1 == 5'b00111) { imm = 64'h3FC0000000000000; } # 0.125 (2^-3)
  else if (xs1 == 5'b01000) { imm = 64'h3FD0000000000000; } # 0.25
  else if (xs1 == 5'b01001) { imm = 64'h3FD4000000000000; } # 0.3125
  else if (xs1 == 5'b01010) { imm = 64'h3FD8000000000000; } # 0.375
  else if (xs1 == 5'b01011) { imm = 64'h3FDC000000000000; } # 0.4375
  else if (xs1 == 5'b01100) { imm = 64'h3FE0000000000000; } # 0.5
  else if (xs1 == 5'b01101) { imm = 64'h3FE4000000000000; } # 0.625
  else if (xs1 == 5'b01110) { imm = 64'h3FE8000000000000; } # 0.75
  else if (xs1 == 5'b01111) { imm = 64'h3FEC000000000000; } # 0.875
  else if (xs1 == 5'b10000) { imm = 64'h3FF0000000000000; } # 1.0
  else if (xs1 == 5'b10001) { imm = 64'h3FF4000000000000; } # 1.25
  else if (xs1 == 5'b10010) { imm = 64'h3FF8000000000000; } # 1.5
  else if (xs1 == 5'b10011) { imm = 64'h3FFC000000000000; } # 1.75
  else if (xs1 == 5'b10100) { imm = 64'h4000000000000000; } # 2.0
  else if (xs1 == 5'b10101) { imm = 64'h4004000000000000; } # 2.5
  else if (xs1 == 5'b10110) { imm = 64'h4008000000000000; } # 3.0
  else if (xs1 == 5'b10111) { imm = 64'h4010000000000000; } # 4.0
  else if (xs1 == 5'b11000) { imm = 64'h4020000000000000; } # 8.0
  else if (xs1 == 5'b11001) { imm = 64'h4030000000000000; } # 16.0
  else if (xs1 == 5'b11010) { imm = 64'h4060000000000000; } # 128.0 (2^7)
  else if (xs1 == 5'b11011) { imm = 64'h4070000000000000; } # 256.0 (2^8)
  else if (xs1 == 5'b11100) { imm = 64'h40E0000000000000; } # 2^15
  else if (xs1 == 5'b11101) { imm = 64'h40F0000000000000; } # 2^16
  else if (xs1 == 5'b11110) { imm = 64'h7FF0000000000000; } # +inf
  else                       { imm = 64'h7FF8000000000000; } # canonical NaN
  F[fd] = imm;
  mark_f_state_dirty();
