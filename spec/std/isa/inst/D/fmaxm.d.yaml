# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fmaxm.d
long_name: Floating-Point Maximum-Number NaN Double-Precision
description: |
  The `fmaxm.d` instruction writes larger of `fs1` and `fs2` to `fd`. It is defined like `fmax.d` instruction, except
  that if either input is NaN, the result is the canonical NaN.
definedBy:
  extension:
    allOf:
      - name: D
      - name: Zfa
assembly: fd, fs1, fs2
encoding:
  match: 0010101----------011-----1010011
  variables:
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  Bits<64> dp_a = F[fs1];
  Bits<64> dp_b = F[fs2];
  if (is_dp_nan?(dp_a) || is_dp_nan?(dp_b)) {
    if (is_dp_signaling_nan?(dp_a) || is_dp_signaling_nan?(dp_b)) {
      set_fp_flag(FpFlag::NV);
    }
    F[fd] = DP_CANONICAL_NAN;
  } else {
    Boolean sign_a = dp_a[63] == 1;
    Boolean sign_b = dp_b[63] == 1;
    Boolean a_lt_b;
    if (sign_a != sign_b) {
      a_lt_b = sign_a;
    } else {
      a_lt_b = (dp_a != dp_b) && (sign_a != (dp_a < dp_b));
    }
    F[fd] = a_lt_b ? dp_b : dp_a;
  }
  mark_f_state_dirty();
