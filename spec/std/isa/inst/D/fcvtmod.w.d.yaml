# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvtmod.w.d
long_name: Floating-Point Convert Double-Precision to Word with Modulo
description: |
  The `fcvtmod.w.d` instruction always rounds towards zero. Bits 31:0 are taken from the rounded, unbounded
  two's complement result, then sign-extended to XLEN bits and written to integer register `xd`. ±∞ and
  NaN are converted to zero.

  Floating-point exception flags are raised the same as they would be for `fcvt.w.d` with the same input
  operand.

  This instruction is only provided if the D extension is implemented. It is encoded like `fcvt.w.d`, but
  with the `xs2` field set to 8 and the `rm` field set to 1 (RTZ). Other `rm` values are reserved.
definedBy:
  extension:
    allOf:
      - name: D
      - name: Zfa
assembly: xd, fs1, rm
encoding:
  match: 110000101000-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
      not: [0, 2, 3, 4, 5, 6, 7]
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  Bits<1>  sign = signF64UI(F[fs1]);
  Bits<16> exp  = expF64UI(F[fs1]);
  Bits<64> sig  = fracF64UI(F[fs1]);

  # NaN or infinity: result is zero, set NV.
  if (exp == 16'h7FF) {
    set_fp_flag(FpFlag::NV);
    X[xd] = 0;
  } else {
    if (exp != 0) {
      sig = sig | 64'h0010000000000000;
    }
    # Align significand to units at bit 12 (same as f64_to_i32 path).
    Bits<16> shiftDist = 16'h427 - exp;
    if ($signed(shiftDist) > 0s) {
      sig = softfloat_shiftRightJam64(sig, shiftDist);
    }
    # RTZ rounding (rm is fixed to 1 by encoding): truncate the low 12 bits.
    # NX flag if any fractional bits were lost.
    if ((sig & 64'hFFF) != 0) {
      set_fp_flag(FpFlag::NX);
    }
    Bits<64> sig64 = sig >> 12;
    Bits<32> sig32 = sig64[31:0];
    # NV flag if value is out of i32 range. Must check the full 64-bit shifted
    # significand, not just sig32: for inputs like 2^32 the overflow bit lands
    # above bit 31 and sig32 would be zero, silently missing the NV condition.
    Bits<32> z = (sign == 1) ? -sig32 : sig32;
    if ((sig64 > 64'hFFFFFFFF) || ((sig32 != 0) && (($signed(z) < 's0) != (sign == 1)))) {
      set_fp_flag(FpFlag::NV);
    }
    # Modular result: take bits 31:0 of the unbounded two's-complement value.
    X[xd] = $signed(z);
  }
