# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vandn.vx
long_name: Vector AND-NOT with scalar
description: |
  Performs a bitwise AND operation between vector register vs2 and the bitwise NOT of scalar register xs1, storing results in vector register vd according to mask vm.
definedBy:
  extension:
    name: Zvbb
assembly: vd, vs2, xs1, vm
encoding:
  match: 000001-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;

  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;
      V[vd + reg_off][end_bit:start_bit] =
        V[vs2 + reg_off][end_bit:start_bit] & ~X[xs1][state.sew-1:0];
    }
  }

  CSR[vstart].VALUE = 0;
