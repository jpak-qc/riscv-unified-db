# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vbrev8.v
long_name: Vector byte reverse within elements
description: |
  Reverses the byte order within each element of vector register vs2, storing results in vector register vd according to mask vm. Similar to vrev8.v but with different encoding.
definedBy:
  extension:
    name: Zvbb
assembly: vd, vs2, vm
encoding:
  match: 010010------01000010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;

  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;
      XReg input = V[vs2 + reg_off][end_bit:start_bit];
      XReg output = 0;

      for (U32 byte = 0; byte < state.sew / 8; byte++) {
        U32 byte_bit = byte * 8;
        for (U32 bit = 0; bit < 8; bit++) {
          output[byte_bit + bit] = input[byte_bit + 7 - bit];
        }
      }

      V[vd + reg_off][end_bit:start_bit] = output[state.sew-1:0];
    }
  }

  CSR[vstart].VALUE = 0;
