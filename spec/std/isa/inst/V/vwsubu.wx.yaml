# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vwsubu.wx
long_name: "widening unsigned subtract: 2xSEW vector minus scalar"
description: |
  Subtracts the zero-extended low-SEW bits of integer register xs1 from each 2*SEW-wide element of vs2, writing the 2*SEW result to vd. Both operands are treated as unsigned; xs1 is zero-extended to 2*SEW before each subtraction. Masked per vm bit; inactive elements are undisturbed.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, xs1, vm
encoding:
  match: 110110-----------110-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg_s = VLEN >> state.log2_sew;
  U32 elems_per_reg_d = VLEN >> (state.log2_sew + 1);
  U32 sew2 = state.sew * 2;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      U32 s_reg = i / elems_per_reg_s;  U32 s_bit = (i % elems_per_reg_s) * state.sew;
      U32 d_reg = i / elems_per_reg_d;  U32 d_bit = (i % elems_per_reg_d) * sew2;
      Bits<128> a = V[vs2 + d_reg][d_bit + sew2 - 1:d_bit];
      Bits<128> b = X[xs1][state.sew - 1:0];
      V[vd + d_reg][d_bit + sew2 - 1:d_bit] = (a - b)[sew2 - 1:0];
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
