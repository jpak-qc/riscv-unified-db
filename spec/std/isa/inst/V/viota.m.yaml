# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: viota.m
long_name: "Exclusive prefix popcount of mask register"
description: |
  For each active element i of vd (0 to vl-1), writes the count of set bits in vs2[0..i-1] (the exclusive prefix popcount) as a SEW-wide integer. Active elements are optionally masked by vm; inactive elements are undisturbed. vstart must be 0.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, vm
encoding:
  match: 010100------10000010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  if (CSR[vstart].VALUE != 0) { raise(ExceptionCode::IllegalInstruction, mode(), $encoding); }
  VectorState state = vector_state();
  XReg count = 0;
  for (U32 i = 0; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      v_elem_write(vd, i, state.log2_sew, {64'b0, count});
      if (V[vs2][i] == 1'b1) { count = count + 1; }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
