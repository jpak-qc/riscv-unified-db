# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vssrl.vx
long_name: "Vector rounding shift right logical with scalar"
description: |
  Performs a rounding logical right shift on each element of vector register vs2 by the shift amount in the low log2(SEW) bits of scalar register xs1, rounding the discarded bits per vxrm, storing results in vector register vd using vector mask vm. This is a fixed-point scaling shift and does not affect vxsat.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, vm
encoding:
  match: 101010-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 shamt = X[xs1][state.sew - 1:0] & (state.sew - 1);
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      Bits<128> v = v_elem_read(vs2, i, state.log2_sew)[state.sew - 1:0];
      v_elem_write(vd, i, state.log2_sew, roundoff_unsigned(v, shamt));
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
