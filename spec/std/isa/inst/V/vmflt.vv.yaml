# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmflt.vv
long_name: "vector FP less-than, vector-vector"
description: |
  Performs an IEEE 754 signaling less-than comparison of each SEW-wide element of vs2 against the corresponding element of vs1, writing a 1-bit result into bit i of mask register vd. Any NaN operand, quiet or signaling, returns false and raises the NV flag. vmfgt.vv assembles as vmflt.vv with source operands swapped; masked-off elements leave vd undisturbed.
definedBy:
  extension:
    name: Zve32f
assembly: vd, vs2, vs1, vm
encoding:
  match: 011011-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
pseudoinstructions:
  - when: "true"
    to: vmfgt.vv vd, vs1, vs2, vm
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  Bits<VLEN> vd_bits = V[vd];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      # SEW=32 uses f32; SEW=64 uses f64 (legal because Zve64d requires Zve32f).
      if (state.log2_sew == 6) {
        Bits<64> a = v_elem_read(vs2, i, 6)[63:0];
        Bits<64> b = v_elem_read(vs1, i, 6)[63:0];
        vd_bits[i] = (f64_lt?(a, b, false)) ? 1'b1 : 1'b0;
      } else {
        Bits<32> a = v_elem_read(vs2, i, 5)[31:0];
        Bits<32> b = v_elem_read(vs1, i, 5)[31:0];
        vd_bits[i] = (f32_lt?(a, b, false)) ? 1'b1 : 1'b0;
      }
    }
  }
  V[vd] = vd_bits;
  CSR[vstart].VALUE = 0;
  mark_f_state_dirty();
  mark_v_state_dirty();
