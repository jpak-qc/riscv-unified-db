# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmulh.vv
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, vm
encoding:
  match: 100111-----------010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      U32 reg_off   = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      Bits<128> a = $signed(V[vs2 + reg_off][start_bit + state.sew - 1:start_bit]);
      Bits<128> b = $signed(V[vs1 + reg_off][start_bit + state.sew - 1:start_bit]);
      v_elem_write(vd, i, state.log2_sew, (a * b)[2 * state.sew - 1:state.sew]);
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
