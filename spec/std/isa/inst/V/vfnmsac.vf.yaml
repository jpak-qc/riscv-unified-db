# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfnmsac.vf
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, fs1, vs2, vm
encoding:
  match: 101111-----------101-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  RoundingMode rmode = rm_to_mode(CSR[fcsr].FRM, $encoding);
  Bits<32> b = F[fs1][31:0];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      v_elem_write(vd, i, 2, {96'b0, f32_muladd(b, v_elem_read(vs2, i, 2)[31:0], v_elem_read(vd, i, 2)[31:0], F32MulAddOp::Softfloat_mulAdd_subProd, rmode)});
    }
  }
  CSR[vstart].VALUE = 0;
  mark_f_state_dirty();
  mark_v_state_dirty();
