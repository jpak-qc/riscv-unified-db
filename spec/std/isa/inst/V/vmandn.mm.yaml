# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmandn.mm
long_name: "mask register AND with complement of vs1"
description: |
  Computes vs2 AND (NOT vs1) across all VLEN mask bits and writes the result to vd. Operates from vstart to VLEN-1, independent of vl and the vm masking bit.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, vs1
encoding:
  match: 0110001----------010-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok($encoding);
  # Read-modify-write: avoid setBit-on-copy ISS bug (see bits.hpp)
  Bits<VLEN> vd_bits = V[vd];
  for (U32 i = CSR[vstart].VALUE; i < VLEN; i++) {
    vd_bits[i] = V[vs2][i] & ~V[vs1][i];
  }
  V[vd] = vd_bits;

  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
