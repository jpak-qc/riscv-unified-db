# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vnclipu.wx
long_name: "Vector narrowing unsigned clip with scalar"
description: |
  Rounds and logically right-shifts the 2*SEW-wide elements of vector register vs2 by the shift amount in scalar register xs1 (masked to log2(2*SEW) bits), then clips the result to the unsigned SEW-bit range, storing in vector register vd using vector mask vm. Sets vxsat if any element is clamped.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, vm
encoding:
  match: 101110-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 shamt = X[xs1][state.sew - 1:0] & (2 * state.sew - 1);
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      Bits<128> wide = v_elem_read(vs2, i, state.log2_sew + 1)[2 * state.sew - 1:0];
      v_elem_write(vd, i, state.log2_sew, sat_unsigned(roundoff_unsigned(wide, shamt), state.sew));
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
