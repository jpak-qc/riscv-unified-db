# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsaddu.vx
long_name: "Vector unsigned saturating addition with scalar"
description: |
  Performs unsigned saturating addition on elements from vector register vs2 and scalar register xs1 and stores results in vector register vd, using vector mask vm. Results that exceed the unsigned SEW-bit range are clamped to the maximum and the vxsat flag is set.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, xs1, vm
encoding:
  match: 100000-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  Bits<128> b = X[xs1][state.sew - 1:0];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      Bits<128> a = v_elem_read(vs2, i, state.log2_sew)[state.sew - 1:0];
      v_elem_write(vd, i, state.log2_sew, sat_unsigned(a + b, state.sew));
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
