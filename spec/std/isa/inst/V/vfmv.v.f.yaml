# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfmv.v.f
long_name: "Vector floating-point to vector move"
description: |
  Moves floating-point element from scalar register fs1 to vector register vd, using vector mask vm. This operation creates a vector with a single floating-point value.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, fs1
encoding:
  match: 010111100000-----101-----1010111
  variables:
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  Bits<32> b = F[fs1][31:0];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    v_elem_write(vd, i, 2, {96'b0, b});
  }
  CSR[vstart].VALUE = 0;
  mark_f_state_dirty();
  mark_v_state_dirty();
