# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsaddu.vi
long_name: "Vector unsigned saturating addition with immediate"
description: |
  Performs unsigned saturating addition on elements from vector register vs2 and a sign-extended immediate and stores results in vector register vd, using vector mask vm. Results that exceed the unsigned SEW-bit range are clamped to the maximum and the vxsat flag is set.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, imm, vm
encoding:
  match: 100000-----------011-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
      sign_extend: true
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  # imm is sign-extended then interpreted as an SEW-wide unsigned operand.
  Bits<128> b = $signed(imm) & ((128'b1 << state.sew) - 1);
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      Bits<128> a = v_elem_read(vs2, i, state.log2_sew)[state.sew - 1:0];
      v_elem_write(vd, i, state.log2_sew, sat_unsigned(a + b, state.sew));
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
