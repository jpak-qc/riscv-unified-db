# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vredmin.vs
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, vm
encoding:
  match: 000101-----------010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  if (CSR[vstart].VALUE != 0) { raise(ExceptionCode::IllegalInstruction, mode(), $encoding); }
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  if (CSR[vl].VALUE == 0) {
    CSR[vstart].VALUE = 0;
  } else {
    Bits<64> acc = V[vs1][state.sew - 1:0];
    for (U32 i = 0; i < CSR[vl].VALUE; i++) {
      if (vm == 1'b1 || V[0][i] == 1'b1) {
        U32 reg_off   = i / elems_per_reg;
        U32 start_bit = (i % elems_per_reg) * state.sew;
        Bits<64> src = V[vs2 + reg_off][start_bit + state.sew - 1:start_bit];
        if ($signed(src[state.sew-1:0]) < $signed(acc[state.sew - 1:0])) { acc = {{64 - state.sew{1'b0}}, src[state.sew-1:0]}; }
      }
    }
    V[vd][state.sew - 1:0] = acc[state.sew - 1:0];
    CSR[vstart].VALUE = 0;
    mark_v_state_dirty();
  }
