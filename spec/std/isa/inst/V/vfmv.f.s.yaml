# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfmv.f.s
long_name: "Vector floating-point move to scalar FP register"
description: |
  Copies element 0 of vector register vs2 into scalar FP register fd, NaN-boxing the result for SP values when D is implemented. No masking; reads element 0 unconditionally. vstart is reset to 0 after execution.
definedBy:
  extension:
    name: Zve32f
assembly: fd, vs2
encoding:
  match: 0100001-----00000001-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  if (state.log2_sew == 6) {
    F[fd] = v_elem_read(vs2, 0, 6)[63:0];
  } else {
    F[fd] = {32'hffffffff, v_elem_read(vs2, 0, 5)[31:0]};
  }
  CSR[vstart].VALUE = 0;
  mark_f_state_dirty();
