# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vnsrl.wi
long_name: "Vector widening logical shift right with immediate"
description: |
  Performs widening logical right shift on elements from vector register vs2 by immediate shift amount and stores results in vector register vd, using vector mask vm. The operation fills with zeros and widens the result.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, imm, vm
encoding:
  match: 101100-----------011-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg_s = VLEN >> state.log2_sew;
  U32 elems_per_reg_w = VLEN >> (state.log2_sew + 1);
  U32 sew2 = state.sew * 2;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      U32 s_reg = i / elems_per_reg_s;  U32 s_bit = (i % elems_per_reg_s) * state.sew;
      U32 w_reg = i / elems_per_reg_w;  U32 w_bit = (i % elems_per_reg_w) * sew2;
      U32 shamt = {27'b0, imm} & (sew2 - 1);
      Bits<128> wide = V[vs2 + w_reg][w_bit + sew2 - 1:w_bit];
      V[vd + s_reg][s_bit + state.sew - 1:s_bit] = (wide >> shamt)[state.sew - 1:0];
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
