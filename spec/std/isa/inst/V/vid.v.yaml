# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vid.v
long_name: "Write element index into each vector element"
description: |
  Writes the zero-based element index i as a SEW-wide value into each active element i of vd for elements 0 to vl-1. Masking is controlled by the vm bit; inactive elements are undisturbed.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vm
encoding:
  match: 010100-0000010001010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      v_elem_write(vd, i, state.log2_sew, {96'b0, i});
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
