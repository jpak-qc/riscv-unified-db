# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: vlsseg5e32.v
long_name: Vector segmented load 5 elements of 32 bits with stride
description: |
  Loads 5 segments of 32-bit elements from memory starting at address in xs1 register with stride, using vector mask vm, and stores results in vector register vd. The effective element width is 32 bits.
definedBy:
  extension:
    name: Zve32x
assembly: vd, (xs1), xs2, vm
encoding:
  match: 100010-----------110-----0000111
  variables:
    - name: vm
      location: 25-25
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 emul_reg = (state.lmul_type == VectorLmulType::Multiply) ? (32'b1 << state.log2_lmul) : 1;
  U32 elems_per_reg = VLEN >> 5;
  XReg virtual_address = X[xs1];
  XReg stride = X[xs2];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      CSR[vstart].VALUE = i;
      for (U32 j = 0; j < 5; j++) {
        U32 reg_off = i / elems_per_reg;
        U32 start_bit_f = (i % elems_per_reg) * 32;
        XReg elem_addr = virtual_address + i * stride + j * 4;
        v_check_load_alignment(32, elem_addr);
        V[vd + j * emul_reg + reg_off][start_bit_f + 31:start_bit_f] = read_memory(32, elem_addr, $encoding)[31:0];
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
