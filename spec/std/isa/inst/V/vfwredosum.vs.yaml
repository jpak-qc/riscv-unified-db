# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfwredosum.vs
long_name: "vector FP widening ordered reduction sum"
description: |
  Performs an ordered widening FP reduction over SEW-wide elements of vs2, accumulating into a 2*SEW running sum initialized from vs1[0] and writing the final result to vd[0]. The strict left-to-right evaluation order prohibits reassociation that would alter IEEE 754 rounding results. Masked elements are excluded; when vl=0, vs1[0] passes through unchanged to vd[0].
definedBy:
  extension:
    name: Zve64d
assembly: vd, vs2, vs1, vm
encoding:
  match: 110011-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  # Ordered reduction: the sequential loop satisfies the ordered summation requirement.
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  if (CSR[vstart].VALUE != 0) { raise(ExceptionCode::IllegalInstruction, mode(), $encoding); }
  VectorState state = vector_state();
  RoundingMode rmode = rm_to_mode(CSR[fcsr].FRM, $encoding);
  if (CSR[vl].VALUE == 0) {
    # V spec §14.3: when vl=0, result is vs1[0] (widened) written to vd[0]
    v_elem_write(vd, 0, state.log2_sew + 1, {64'b0, V[vs1][63:0]});
    CSR[vstart].VALUE = 0;
    mark_f_state_dirty();
    mark_v_state_dirty();
  } else {
    Bits<64> acc = V[vs1][63:0];
    for (U32 i = 0; i < CSR[vl].VALUE; i++) {
      if (v_mask_elem_active?(vm, i)) {
        Bits<32> elem32 = v_elem_read(vs2, i, state.log2_sew)[31:0];
        acc = f64_add(acc, f32_to_f64(elem32, rmode), rmode);
      }
    }
    v_elem_write(vd, 0, state.log2_sew + 1, {64'b0, acc});
    CSR[vstart].VALUE = 0;
    mark_f_state_dirty();
    mark_v_state_dirty();
  }
