# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vlm.v
long_name: Vector load mask
description: |
  Loads a vector mask from memory starting at address in xs1 register and stores it in vector register vd. This operation is used to load previously saved vector masks.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1)
encoding:
  match: 000000101011-----000-----0000111
  variables:
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok($encoding);
  XReg virtual_address = X[xs1];
  # Load ceil(vl/8) bytes into the mask register vd, bit by bit
  U32 num_bytes = (CSR[vl].VALUE + 7) / 8;
  for (U32 b = 0; b < num_bytes; b++) {
    Bits<8> byte_val = read_memory(8, virtual_address + b, $encoding)[7:0];
    for (U32 bit = 0; bit < 8; bit++) {
      U32 idx = b * 8 + bit;
      if (idx < CSR[vl].VALUE) {
        V[vd][idx] = byte_val[bit];
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
