# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vlm.v
long_name: Vector load mask
description: |
  Loads a vector mask from memory starting at address in xs1 register and stores it in vector register vd. This operation is used to load previously saved vector masks.
definedBy:
  extension:
    name: Zve32x
assembly: vd, (xs1)
encoding:
  match: 000000101011-----000-----0000111
  variables:
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok($encoding);
  XReg virtual_address = X[xs1];
  # Load ceil(vl/8) bytes into the mask register vd.
  # Each full byte is written entirely -- the partial final byte is not bit-masked
  # to vl (Sail writes all 8 bits of each loaded byte regardless of vl mod 8).
  # Use read-modify-write to avoid setBit-on-copy ISS bug (V[vd] returns by value).
  Bits<VLEN> vd_bits = V[vd];
  U32 num_bytes = (CSR[vl].VALUE + 7) / 8;
  for (U32 b = CSR[vstart].VALUE; b < num_bytes; b++) {
    Bits<8> byte_val = read_memory(8, virtual_address + b, $encoding)[7:0];
    U32 base_idx = b * 8;
    vd_bits[base_idx + 7:base_idx] = byte_val;
  }
  V[vd] = vd_bits;
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
