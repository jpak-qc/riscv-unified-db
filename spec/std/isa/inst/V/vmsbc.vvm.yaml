# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmsbc.vvm
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, vs1, v0
encoding:
  match: 0100110----------000-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  Bits<VLEN> vd_bits = V[vd];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 reg_off   = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit   = start_bit + state.sew - 1;
    Bits<128> a   = V[vs2 + reg_off][end_bit:start_bit];
    Bits<128> b   = V[vs1 + reg_off][end_bit:start_bit];
    vd_bits[i] = (a < b || (V[0][i] == 1'b1 && a == b)) ? 1'b1 : 1'b0;
  }
  V[vd] = vd_bits;
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
