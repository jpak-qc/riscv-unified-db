# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vrgather.vi
long_name: "Vector register gather with immediate index"
description: |
  Gathers elements from vector register vs2 using immediate index value and stores results in vector register vd, using vector mask vm. This operation performs indexed element selection.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, imm, vm
encoding:
  match: 001100-----------011-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  XReg vlmax;
  if (state.lmul_type == VectorLmulType::Multiply) {
    vlmax = (VLEN << state.log2_lmul) >> state.log2_sew;
  } else {
    vlmax = (VLEN >> state.log2_lmul) >> state.log2_sew;
  }
  U32 idx = {27'b0, imm};
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      U32 d_reg = i / elems_per_reg;  U32 d_bit = (i % elems_per_reg) * state.sew;
      if (idx < vlmax) {
        U32 s_reg = idx / elems_per_reg;  U32 s_bit = (idx % elems_per_reg) * state.sew;
        V[vd + d_reg][d_bit + state.sew - 1:d_bit] = V[vs2 + s_reg][s_bit + state.sew - 1:s_bit];
      } else {
        V[vd + d_reg][d_bit + state.sew - 1:d_bit] = 0;
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
