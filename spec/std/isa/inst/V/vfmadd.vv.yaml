# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfmadd.vv
long_name: "vector fp multiply-add, vector-vector"
description: |
  Performs element-wise fused multiply-add vd[i] = vs1[i] * vd[i] + vs2[i] in SEW-wide floating-point for active elements (vm-masked). vd is both multiplicand and destination; vs2 is the addend. Inactive elements are undisturbed; rounding uses fcsr.FRM.
definedBy:
  extension:
    name: Zve32f
assembly: vd, vs1, vs2, vm
encoding:
  match: 101000-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  RoundingMode rmode = rm_to_mode(CSR[fcsr].FRM, $encoding);
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      # SEW=32 uses f32; SEW=64 uses f64 (legal because Zve64d requires Zve32f).
      if (state.log2_sew == 6) {
        Bits<64> vs1v = v_elem_read(vs1, i, 6)[63:0];
        Bits<64> vs2v = v_elem_read(vs2, i, 6)[63:0];
        Bits<64> vdv  = v_elem_read(vd,  i, 6)[63:0];
        v_elem_write(vd, i, 6, {64'b0, f64_muladd(vs1v, vdv, vs2v, F64MulAddOp::Softfloat_f64_mulAdd_addC, rmode)});
      } else {
        Bits<32> vs1v = v_elem_read(vs1, i, 5)[31:0];
        Bits<32> vdv  = v_elem_read(vd,  i, 5)[31:0];
        Bits<32> vs2v = v_elem_read(vs2, i, 5)[31:0];
        v_elem_write(vd, i, 5, {96'b0, f32_muladd(vs1v, vdv, vs2v, F32MulAddOp::Softfloat_mulAdd_addC, rmode)});
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_f_state_dirty();
  mark_v_state_dirty();
