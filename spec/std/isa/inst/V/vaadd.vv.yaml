# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vaadd.vv
long_name: "Vector signed averaging add"
description: |
  Adds elements from vector registers vs2 and vs1 (sign-extended to one extra bit to avoid overflow), rounds the sum per vxrm, and shifts right by 1, storing the SEW-wide average in vd using vector mask vm. Does not affect vxsat.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, vs1, vm
encoding:
  match: 001001-----------010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      Bits<128> a = $signed(v_elem_read(vs2, i, state.log2_sew)[state.sew - 1:0]);
      Bits<128> b = $signed(v_elem_read(vs1, i, state.log2_sew)[state.sew - 1:0]);
      v_elem_write(vd, i, state.log2_sew, roundoff_signed(a + b, 1));
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
