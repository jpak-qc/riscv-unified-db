# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmerge.vim
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, imm, v0
encoding:
  match: 0101110----------011-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
      sign_extend: true
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  Bits<64> sext_imm = $signed(imm);
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (V[0][i] == 1'b1) {
      v_elem_write(vd, i, state.log2_sew, {64'b0, sext_imm});
    } else {
      v_elem_write(vd, i, state.log2_sew, v_elem_read(vs2, i, state.log2_sew));
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
