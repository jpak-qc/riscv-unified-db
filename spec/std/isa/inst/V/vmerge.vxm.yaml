# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmerge.vxm
long_name: "Merge vector and scalar register using mask v0"
description: |
  Selects between vs2 and integer register xs1 for each element using mask register v0 as the selector: where v0[i]=1, vd[i] = xs1; where v0[i]=0, vd[i] = vs2[i]. Always unmasked (vm=0 is implicit); all active elements in [vstart, vl) are written.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, xs1, v0
encoding:
  match: 0101110----------100-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  Bits<64> scalar_val = X[xs1][63:0];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (V[0][i] == 1'b1) {
      v_elem_write(vd, i, state.log2_sew, {64'b0, scalar_val});
    } else {
      v_elem_write(vd, i, state.log2_sew, v_elem_read(vs2, i, state.log2_sew));
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
