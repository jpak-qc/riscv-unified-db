# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfredosum.vs
long_name: "vector FP ordered reduction sum into scalar"
description: |
  Reduces active elements of vs2 by floating-point addition in strict left-to-right order, seeded with vs1[0], and writes the result to vd[0]; elements 1..VLMAX-1 of vd are undisturbed. The mandatory evaluation order prevents reassociation and yields deterministic rounding; use vfredusum when ordering does not matter. When vl=0, vs1[0] is copied directly to vd[0].
definedBy:
  extension:
    name: Zve32f
assembly: vd, vs2, vs1, vm
encoding:
  match: 000011-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  if (CSR[vstart].VALUE != 0) { raise(ExceptionCode::IllegalInstruction, mode(), $encoding); }
  RoundingMode rmode = rm_to_mode(CSR[fcsr].FRM, $encoding);
  if (CSR[vl].VALUE == 0) {
    # V spec §14.3: when vl=0, result is vs1[0] written to vd[0]
    if (state.log2_sew == 6) {
      v_elem_write(vd, 0, 6, {64'b0, V[vs1][63:0]});
    } else {
      v_elem_write(vd, 0, 5, {96'b0, V[vs1][31:0]});
    }
    CSR[vstart].VALUE = 0;
    mark_f_state_dirty();
    mark_v_state_dirty();
  } else {
    if (state.log2_sew == 6) {
      Bits<64> acc = V[vs1][63:0];
      for (U32 i = 0; i < CSR[vl].VALUE; i++) {
        if (v_mask_elem_active?(vm, i)) {
          Bits<64> elem = v_elem_read(vs2, i, 6)[63:0];
          acc = f64_add(acc, elem, rmode);
        }
      }
      v_elem_write(vd, 0, 6, {64'b0, acc});
    } else {
      Bits<32> acc = V[vs1][31:0];
      for (U32 i = 0; i < CSR[vl].VALUE; i++) {
        if (v_mask_elem_active?(vm, i)) {
          Bits<32> elem = v_elem_read(vs2, i, 5)[31:0];
          acc = f32_add(acc, elem, rmode);
        }
      }
      v_elem_write(vd, 0, 5, {96'b0, acc});
    }
    CSR[vstart].VALUE = 0;
    mark_f_state_dirty();
    mark_v_state_dirty();
  }
