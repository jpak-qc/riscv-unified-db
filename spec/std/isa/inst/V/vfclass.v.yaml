# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfclass.v
long_name: "vector FP classify elements"
description: |
  Writes a 10-bit one-hot classification of each active vs2 FP element into the corresponding vd element, using the same bit encoding as the scalar fclass instruction: bits 0-9 represent negative infinity, negative normal, negative subnormal, negative zero, positive zero, positive subnormal, positive normal, positive infinity, quiet NaN, and signaling NaN. The result is stored as an integer bit pattern at SEW width; no FP exceptions are raised.
definedBy:
  extension:
    name: Zve32f
assembly: vd, vs2, vm
encoding:
  match: 010011------10000001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      # SEW=32 uses f32; SEW=64 uses f64 (legal because Zve64d requires Zve32f).
      if (state.log2_sew == 6) {
        Bits<64> a = v_elem_read(vs2, i, 6)[63:0];
        v_elem_write(vd, i, 6, {64'b0, f64_classify(a)});
      } else {
        Bits<32> a = v_elem_read(vs2, i, 5)[31:0];
        v_elem_write(vd, i, 5, {96'b0, f32_classify(a)});
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
