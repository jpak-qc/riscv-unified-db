# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmadc.vi
long_name: "Vector multiply-add with carry and immediate"
description: |
  Performs multiply-add operation on elements from vector register vs2 and immediate value, adds the carry-in from vector register vs3, and stores results in vector register vd, using vector mask vm.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, imm
encoding:
  match: 0100011----------011-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
      sign_extend: true
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  Bits<64> sext_imm = $signed(imm);
  Bits<128> b = {64'b0, sext_imm} & ((128'b1 << state.sew) - 1);
  Bits<VLEN> vd_bits = V[vd];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 reg_off   = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit   = start_bit + state.sew - 1;
    Bits<128> a   = V[vs2 + reg_off][end_bit:start_bit];
    Bits<129> sum = (a + b);
    vd_bits[i] = sum[state.sew];
  }
  V[vd] = vd_bits;
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
