# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmfgt.vf
long_name: "Vector FP greater-than, vector-scalar"
description: |
  Compares each SEW-wide element of vs2 against scalar FP register fs1 using IEEE 754 signaling greater-than, writing a 1-bit result into bit i of mask register vd. Implemented as f_lt(fs1, vs2[i]): returns true when fs1 is strictly less than the vector element. Any NaN operand raises NV and returns false; when SEW=32 with D present, fs1 is NaN-boxed.
definedBy:
  extension:
    name: Zve32f
assembly: vd, vs2, fs1, vm
encoding:
  match: 011101-----------101-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  Bits<VLEN> vd_bits = V[vd];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      # SEW=32 uses f32; SEW=64 uses f64 (legal because Zve64d requires Zve32f).
      if (state.log2_sew == 6) {
        Bits<64> a = v_elem_read(vs2, i, 6)[63:0];
        Bits<64> b = F[fs1][63:0];
        vd_bits[i] = (f64_lt?(b, a, false)) ? 1'b1 : 1'b0;
      } else {
        Bits<32> a = v_elem_read(vs2, i, 5)[31:0];
        Bits<32> b = F[fs1][31:0];
        if (implemented?(ExtensionName::D) && F[fs1][63:32] != 32'hffffffff) {
          b = SP_CANONICAL_NAN;
        }
        vd_bits[i] = (f32_lt?(b, a, false)) ? 1'b1 : 1'b0;
      }
    }
  }
  V[vd] = vd_bits;
  CSR[vstart].VALUE = 0;
  mark_f_state_dirty();
  mark_v_state_dirty();
