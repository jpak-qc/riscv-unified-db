# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsll.vx
long_name: Vector shift left logical scalar
description: |
  Performs logical left shift on elements from vs2 using shift amount from rs1, according to mask vm, and stores results in vd. Only the low lg2(SEW) bits of the shift amount are used. Supports vector masking and follows vector tail policy.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, xs1, vm
encoding:
  match: 100101-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  U32 shamt = X[xs1][31:0] & (state.sew - 1);
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      U32 reg_off   = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit   = start_bit + state.sew - 1;
      V[vd + reg_off][end_bit:start_bit] = V[vs2 + reg_off][end_bit:start_bit] << shamt;
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
