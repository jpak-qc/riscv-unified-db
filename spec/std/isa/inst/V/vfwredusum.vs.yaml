# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfwredusum.vs
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, vm
encoding:
  match: 110001-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  # UNORDERED widening reduction (v-spec 1.0 §14.3): the sum may be computed in any
  # order (e.g. tree reduction). This model uses a sequential left-to-right loop as
  # one valid ordering; a backend is permitted to reassociate for parallelism, unlike
  # vfwredosum which mandates strict left-to-right evaluation.
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  if (CSR[vstart].VALUE != 0) { raise(ExceptionCode::IllegalInstruction, mode(), $encoding); }
  VectorState state = vector_state();
  RoundingMode rmode = rm_to_mode(CSR[fcsr].FRM, $encoding);
  if (CSR[vl].VALUE == 0) {
    CSR[vstart].VALUE = 0;
  } else {
    Bits<64> acc = V[vs1][63:0];
    for (U32 i = 0; i < CSR[vl].VALUE; i++) {
      if (v_mask_elem_active?(vm, i)) {
        Bits<32> elem32 = v_elem_read(vs2, i, state.log2_sew)[31:0];
        acc = f64_add(acc, f32_to_f64(elem32, rmode), rmode);
      }
    }
    v_elem_write(vd, 0, state.log2_sew + 1, {64'b0, acc});
    CSR[vstart].VALUE = 0;
    mark_f_state_dirty();
    mark_v_state_dirty();
  }
