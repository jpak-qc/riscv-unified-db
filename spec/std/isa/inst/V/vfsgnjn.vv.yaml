# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfsgnjn.vv
long_name: "vector FP negated sign injection, vector-vector"
description: |
  Copies each element of vs2 with its sign bit replaced by the logical NOT of the corresponding vs1 element's sign bit. When vs2 and vs1 name the same register, the encoding serves as the vfneg.v pseudoinstruction. No FP exceptions are raised.
definedBy:
  extension:
    name: Zve32f
assembly: vd, vs2, vs1, vm
encoding:
  match: 001001-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
pseudoinstructions:
  - when: vs2 == vs1
    to: vfneg.v vd, vs2
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      # SEW=32 uses f32; SEW=64 uses f64 (legal because Zve64d requires Zve32f).
      if (state.log2_sew == 6) {
        Bits<64> a = v_elem_read(vs2, i, 6)[63:0];
        Bits<64> b = v_elem_read(vs1, i, 6)[63:0];
        Bits<1> sign = ~b[63];
        v_elem_write(vd, i, 6, {64'b0, {sign, a[62:0]}});
      } else {
        Bits<32> a = v_elem_read(vs2, i, 5)[31:0];
        Bits<32> b = v_elem_read(vs1, i, 5)[31:0];
        Bits<1> sign = ~b[31];
        v_elem_write(vd, i, 5, {96'b0, {sign, a[30:0]}});
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
