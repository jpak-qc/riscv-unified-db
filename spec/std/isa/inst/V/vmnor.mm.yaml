# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmnor.mm
long_name: "Mask register bitwise NOR"
description: |
  Computes the bitwise complement of OR of mask registers vs2 and vs1 across all VLEN bits starting from vstart, writing the result to vd. Not bounded by vl; the vm bit has no masking effect.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, vs1
encoding:
  match: 0111101----------010-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok($encoding);
  # Read-modify-write: avoid setBit-on-copy ISS bug (see bits.hpp)
  Bits<VLEN> vd_bits = V[vd];
  for (U32 i = CSR[vstart].VALUE; i < VLEN; i++) {
    vd_bits[i] = ~(V[vs2][i] | V[vs1][i]);
  }
  V[vd] = vd_bits;

  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
