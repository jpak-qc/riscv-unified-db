# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vwmulsu.vv
long_name: "Vector widening signed-unsigned multiplication"
description: |
  Performs signed-unsigned multiplication on elements from vector registers vs2 (signed) and vs1 (unsigned), widens the results, and stores them in vector register vd, using vector mask vm.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, vs1, vm
encoding:
  match: 111010-----------010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg_s = VLEN >> state.log2_sew;
  U32 elems_per_reg_d = VLEN >> (state.log2_sew + 1);
  U32 sew2 = state.sew * 2;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      U32 s_reg = i / elems_per_reg_s;  U32 s_bit = (i % elems_per_reg_s) * state.sew;
      U32 d_reg = i / elems_per_reg_d;  U32 d_bit = (i % elems_per_reg_d) * sew2;
      Bits<128> a = $signed(V[vs2 + s_reg][s_bit + state.sew - 1:s_bit]);
      Bits<128> b = V[vs1 + s_reg][s_bit + state.sew - 1:s_bit];
      V[vd + d_reg][d_bit + sew2 - 1:d_bit] = (a * b)[sew2 - 1:0];
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
