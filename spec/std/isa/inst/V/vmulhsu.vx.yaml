# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmulhsu.vx
long_name: "vector signed-by-unsigned multiply high half, scalar, vx"
description: |
  Multiplies each signed vs2 element by the unsigned scalar xs1 (zero-extended to SEW), writing the upper SEW bits of the 2*SEW product into vd. vs2 sign-extends and xs1 zero-extends for the mixed-sign multiplication. Inactive elements under vm mask control are undisturbed.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, xs1, vm
encoding:
  match: 100110-----------110-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  Bits<128> scalar_uzext = X[xs1][state.sew - 1:0];  # zero-extend to SEW width only
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      U32 reg_off   = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      Bits<128> a = $signed(V[vs2 + reg_off][start_bit + state.sew - 1:start_bit]);
      v_elem_write(vd, i, state.log2_sew, (a * scalar_uzext)[2 * state.sew - 1:state.sew]);
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
