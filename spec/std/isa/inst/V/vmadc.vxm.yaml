# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmadc.vxm
long_name: "Vector multiply-add with carry and scalar, masked"
description: |
  Performs multiply-add operation on elements from vector register vs2 and scalar register xs1, adds the carry-in from vector register vs3, and stores results in vector register vd, using vector mask vm. This variant includes additional masking behavior.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, v0
encoding:
  match: 0100010----------100-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  Bits<128> b = X[xs1][state.sew - 1:0];
  Bits<VLEN> vd_bits = V[vd];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 reg_off   = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit   = start_bit + state.sew - 1;
    Bits<128> a   = V[vs2 + reg_off][end_bit:start_bit];
    Bits<128> cin = {127'b0, V[0][i]};
    Bits<129> sum = (a + b + cin);
    vd_bits[i] = sum[state.sew];
  }
  V[vd] = vd_bits;
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
