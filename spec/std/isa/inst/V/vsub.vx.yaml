# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsub.vx
long_name: Vector-scalar integer subtraction
description: |
  Subtracts scalar rs1 from elements of vs2 according to mask vm and stores results in vd. Element width is determined by SEW setting.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, xs1, vm
encoding:
  match: 000010-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  Bits<64> scalar_val = X[xs1][state.sew - 1:0];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      v_elem_write(vd, i, state.log2_sew, v_elem_read(vs2, i, state.log2_sew) - {64'b0, scalar_val});
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
