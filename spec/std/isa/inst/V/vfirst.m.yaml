# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfirst.m
long_name: "find index of first set bit in mask"
description: |
  Searches mask register vs2 for the lowest-indexed active set bit among elements 0 to vl-1, optionally masked by vm, and writes that index to scalar integer register xd. Writes -1 (all-ones, XLEN wide) if no active set bit is found; vstart must be 0.
definedBy:
  extension:
    name: Zve32x
assembly: xd, vs2, vm
encoding:
  match: 010000------10001010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  if (CSR[vstart].VALUE != 0) { raise(ExceptionCode::IllegalInstruction, mode(), $encoding); }
  Boolean found = false;
  XReg first_idx = 0;
  for (U32 i = 0; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      if (found == false && V[vs2][i] == 1'b1) {
        first_idx = i;
        found = true;
      }
    }
  }
  # Return the index of the first set bit, or -1 (all-ones XLEN bits) if none found.
  # Use explicit 64-bit all-ones rather than ~0 (which would be Bits<1> NOT in IDL).
  X[xd] = found ? first_idx : ~64'b0;
  CSR[vstart].VALUE = 0;
