# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfredusum.vs
long_name: "vector FP unordered reduction sum into scalar"
description: |
  Reduces active elements of vs2 by floating-point addition seeded with vs1[0], writing the sum to vd[0]; unlike vfredosum, the implementation may evaluate additions in any order (tree reduction, etc.) for increased parallelism, so rounding results may differ from left-to-right evaluation. When vl=0, vs1[0] is copied to vd[0].
definedBy:
  extension:
    name: Zve32f
assembly: vd, vs2, vs1, vm
encoding:
  match: 000001-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  # UNORDERED reduction (v-spec 1.0 §14.3): the sum may be computed in any order
  # (e.g. tree reduction). This model uses a sequential left-to-right loop as one
  # valid ordering; a backend is permitted to reassociate for parallelism, unlike
  # vfredosum which mandates strict left-to-right evaluation.
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  if (CSR[vstart].VALUE != 0) { raise(ExceptionCode::IllegalInstruction, mode(), $encoding); }
  RoundingMode rmode = rm_to_mode(CSR[fcsr].FRM, $encoding);
  if (CSR[vl].VALUE == 0) {
    # V spec §14.3: when vl=0, result is vs1[0] written to vd[0]
    # SEW=32 uses f32; SEW=64 uses f64 (legal because Zve64d requires Zve32f).
    if (state.log2_sew == 6) {
      v_elem_write(vd, 0, 6, {64'b0, V[vs1][63:0]});
    } else {
      v_elem_write(vd, 0, 5, {96'b0, V[vs1][31:0]});
    }
    CSR[vstart].VALUE = 0;
    mark_f_state_dirty();
    mark_v_state_dirty();
  } else {
    # SEW=32 uses f32; SEW=64 uses f64 (legal because Zve64d requires Zve32f).
    if (state.log2_sew == 6) {
      Bits<64> acc = V[vs1][63:0];
      for (U32 i = 0; i < CSR[vl].VALUE; i++) {
        if (v_mask_elem_active?(vm, i)) {
          Bits<64> elem = v_elem_read(vs2, i, 6)[63:0];
          acc = f64_add(acc, elem, rmode);
        }
      }
      v_elem_write(vd, 0, 6, {64'b0, acc});
    } else {
      Bits<32> acc = V[vs1][31:0];
      for (U32 i = 0; i < CSR[vl].VALUE; i++) {
        if (v_mask_elem_active?(vm, i)) {
          Bits<32> elem = v_elem_read(vs2, i, 5)[31:0];
          acc = f32_add(acc, elem, rmode);
        }
      }
      v_elem_write(vd, 0, 5, {96'b0, acc});
    }
    mark_f_state_dirty();
    mark_v_state_dirty();
    CSR[vstart].VALUE = 0;
  }
