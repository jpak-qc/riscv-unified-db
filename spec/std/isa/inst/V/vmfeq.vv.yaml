# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmfeq.vv
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, vm
encoding:
  match: 011000-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  Bits<VLEN> vd_bits = V[vd];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      Bits<32> a = v_elem_read(vs2, i, 2)[31:0];
      Bits<32> b = v_elem_read(vs1, i, 2)[31:0];
      vd_bits[i] = (f32_eq?(a, b, true)) ? 1'b1 : 1'b0;
    }
  }
  V[vd] = vd_bits;
  CSR[vstart].VALUE = 0;
  mark_f_state_dirty();
  mark_v_state_dirty();
