# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmv1r.v
long_name: "move 1 vector register as a unit"
description: |
  Copies all VLEN bits of vs2 into vd as a whole-register move. Bypasses vtype validity checks (vill-exempt) and operates independently of vl, vstart, SEW, and LMUL. No masking applies.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2
encoding:
  match: 1001111-----00000011-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok($encoding);   # whole-register move: vill-exempt, VS-check only
  V[vd] = V[vs2];
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
