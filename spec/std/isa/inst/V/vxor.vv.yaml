# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vxor.vv
long_name: Vector-vector bitwise XOR
description: |
  Performs bitwise XOR on corresponding elements from vs1 and vs2 according to mask vm and stores results in vd. Element width is determined by SEW setting.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, vs1, vm
encoding:
  match: 001011-----------000-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      v_elem_write(vd, i, state.log2_sew, v_elem_read(vs2, i, state.log2_sew) ^ v_elem_read(vs1, i, state.log2_sew));
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
