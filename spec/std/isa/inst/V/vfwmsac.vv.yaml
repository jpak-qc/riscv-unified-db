# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfwmsac.vv
long_name: "vector FP widening multiply-subtract accumulator, vector-vector"
description: |
  Computes vd[i] = vs1[i] * vs2[i] - vd[i] for each active element. vs1 and vs2 are read at SEW width; the widened product minus the existing 2*SEW accumulator in vd is stored at 2*SEW width. Inactive elements are undisturbed.
definedBy:
  extension:
    name: Zve64d
assembly: vd, vs1, vs2, vm
encoding:
  match: 111110-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  RoundingMode rmode = rm_to_mode(CSR[fcsr].FRM, $encoding);
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      Bits<64> a = f32_to_f64(v_elem_read(vs1, i, state.log2_sew)[31:0], rmode);
      Bits<64> b = f32_to_f64(v_elem_read(vs2, i, state.log2_sew)[31:0], rmode);
      Bits<64> c = v_elem_read(vd, i, state.log2_sew + 1)[63:0];
      v_elem_write(vd, i, state.log2_sew + 1, {64'b0, f64_muladd(a, b, c, F64MulAddOp::Softfloat_f64_mulAdd_subC, rmode)});
    }
  }
  CSR[vstart].VALUE = 0;
  mark_f_state_dirty();
  mark_v_state_dirty();
