# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vdiv.vx
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, vm
encoding:
  match: 100001-----------110-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  Bits<64> scalar_val = X[xs1][63:0];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      v_elem_write(vd, i, state.log2_sew, ($signed(v_elem_read(vs2, i, state.log2_sew)[state.sew - 1:0]) / $signed(scalar_val[state.sew - 1:0]))[state.sew - 1:0]);
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
