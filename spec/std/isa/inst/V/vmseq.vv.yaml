# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmseq.vv
long_name: Vector mask equal
description: |
  Sets mask bits where elements in vs2 equal elements in vs1, according to mask vm, and stores results in vd. Element width is determined by SEW setting. Supports vector masking and follows vector tail policy.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, vm
encoding:
  match: 011000-----------000-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  # Initialize all mask destination bits to 0 before writing active elements
  # (ISS requires all bits of a mask register to be defined before it is used as a source)
  for (U32 k = 0; k < VLEN; k++) { V[vd][k] = 1'b0; }
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      V[vd][i] = (v_elem_read(vs2, i, state.log2_sew)[state.sew-1:0] == v_elem_read(vs1, i, state.log2_sew)[state.sew-1:0]) ? 1'b1 : 1'b0;
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
