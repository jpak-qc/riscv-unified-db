# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: vsseg7e64.v
long_name: Vector segmented store 7 elements of 64 bits
description: |
  Stores 7 segments of 64-bit elements from vector register vs2 to memory starting at address in xs1 register, using vector mask vm. The effective element width is 64 bits regardless of SEW setting.
definedBy:
  extension:
    name: Zvl32b
assembly: vs3, (xs1), vm
encoding:
  match: 110000-00000-----111-----0100111
  variables:
    - name: vm
      location: 25-25
    - name: xs1
      location: 19-15
    - name: vs3
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 emul_reg = (state.lmul_type == VectorLmulType::Multiply) ? (32'b1 << state.log2_lmul) : 1;
  U32 elems_per_reg = VLEN >> 6;
  XReg virtual_address = X[xs1];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      CSR[vstart].VALUE = i;
      for (U32 j = 0; j < 7; j++) {
        U32 start_bit_f = (i % elems_per_reg) * 64;
        write_memory(64, virtual_address + (i * 7 + j) * 8, V[vs3 + j * emul_reg][start_bit_f + 63:start_bit_f], $encoding);
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
