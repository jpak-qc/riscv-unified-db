# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vzext.vf4
long_name: "Vector zero-extend by factor of 4"
description: |
  Zero-extends elements from vector register vs2 by a factor of 4 and stores results in vector register vd, using vector mask vm. The operation extends SEW to 4×SEW.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vm
encoding:
  match: 010010------00100010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 log2_src_sew = state.log2_sew - 2;
  U32 src_sew = state.sew >> 2;
  U32 elems_per_reg_d   = VLEN >> state.log2_sew;
  U32 elems_per_reg_src = VLEN >> log2_src_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 d_reg   = i / elems_per_reg_d;    U32 d_bit   = (i % elems_per_reg_d) * state.sew;
      U32 src_reg = i / elems_per_reg_src;  U32 src_bit = (i % elems_per_reg_src) * src_sew;
      Bits<128> val = V[vs2 + src_reg][src_bit + src_sew - 1:src_bit];
      V[vd + d_reg][d_bit + state.sew - 1:d_bit] = val[state.sew - 1:0];
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
