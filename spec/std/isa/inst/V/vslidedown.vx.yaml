# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vslidedown.vx
long_name: "Vector slide down with scalar"
description: |
  Slides elements in vector register vs2 down by 1 position, inserting scalar register xs1 at the top, and stores results in vector register vd, using vector mask vm.
definedBy:
  extension:
    name: Zve32x
assembly: vd, vs2, xs1, vm
encoding:
  match: 001111-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  XReg vlmax;
  if (state.lmul_type == VectorLmulType::Multiply) {
    vlmax = (VLEN << state.log2_lmul) >> state.log2_sew;
  } else {
    vlmax = (VLEN >> state.log2_lmul) >> state.log2_sew;
  }
  XReg offset = X[xs1];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      U32 d_reg = i / elems_per_reg;  U32 d_bit = (i % elems_per_reg) * state.sew;
      XReg s_idx = i + offset;
      # Guard against 64-bit overflow when offset is large (e.g. 0xFFFF...FFFF).
      # If offset >= vlmax OR the addition wrapped (s_idx < i), treat as out-of-bounds.
      if (offset < vlmax && s_idx >= offset && s_idx < vlmax) {
        U32 s_reg = s_idx / elems_per_reg;  U32 s_bit = (s_idx % elems_per_reg) * state.sew;
        V[vd + d_reg][d_bit + state.sew - 1:d_bit] = V[vs2 + s_reg][s_bit + state.sew - 1:s_bit];
      } else {
        V[vd + d_reg][d_bit + state.sew - 1:d_bit] = 0;
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
