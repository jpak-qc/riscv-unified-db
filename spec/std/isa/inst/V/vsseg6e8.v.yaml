# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: vsseg6e8.v
long_name: Vector segmented store 6 elements of 8 bits
description: |
  Stores 6 segments of 8-bit elements from vector register vs2 to memory starting at address in xs1 register, using vector mask vm. The effective element width is 8 bits regardless of SEW setting.
definedBy:
  extension:
    name: Zvl32b
assembly: vs3, (xs1), vm
encoding:
  match: 101000-00000-----000-----0100111
  variables:
    - name: vm
      location: 25-25
    - name: xs1
      location: 19-15
    - name: vs3
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> 3;
  XReg virtual_address = X[xs1];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      for (U32 j = 0; j < 6; j++) {
        U32 start_bit_f = (i % elems_per_reg) * 8;
        write_memory(8, virtual_address + (i * 6 + j) * 1, V[vs3 + j][start_bit_f + 7:start_bit_f], $encoding);
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
