# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: vlseg8e64ff.v
long_name: Vector segmented load 8 elements of 64 bits, fault-first
description: |
  Loads 8 segments of 64-bit elements from memory starting at address in xs1 register, using vector mask vm, and stores results in vector register vd. This is a fault-first operation that stops on the first fault. The effective element width is 64 bits.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1), vm
encoding:
  match: 111000-10000-----111-----0000111
  variables:
    - name: vm
      location: 25-25
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> 6;
  XReg virtual_address = X[xs1];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      for (U32 j = 0; j < 8; j++) {
        U32 start_bit_f = (i % elems_per_reg) * 64;
        V[vd + j][start_bit_f + 63:start_bit_f] = read_memory(64, virtual_address + (i * 8 + j) * 8, $encoding)[63:0];
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
