# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmfne.vv
long_name: "vector FP not-equal, vector-vector"
description: |
  Compares each SEW-wide FP element of vs2 against the corresponding element of vs1 for IEEE 754 inequality, writing the logical negation of the quiet-equal result into bit i of mask register vd. Quiet NaN inputs return true (unordered) without raising NV; only sNaN inputs raise the NV flag. Masked-off elements leave vd undisturbed.
definedBy:
  extension:
    name: Zve32f
assembly: vd, vs2, vs1, vm
encoding:
  match: 011100-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  Bits<VLEN> vd_bits = V[vd];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      if (state.log2_sew == 6) {
        Bits<64> a = v_elem_read(vs2, i, 6)[63:0];
        Bits<64> b = v_elem_read(vs1, i, 6)[63:0];
        vd_bits[i] = (!f64_eq?(a, b, true)) ? 1'b1 : 1'b0;
      } else {
        Bits<32> a = v_elem_read(vs2, i, 5)[31:0];
        Bits<32> b = v_elem_read(vs1, i, 5)[31:0];
        vd_bits[i] = (!f32_eq?(a, b, true)) ? 1'b1 : 1'b0;
      }
    }
  }
  V[vd] = vd_bits;
  CSR[vstart].VALUE = 0;
  mark_f_state_dirty();
  mark_v_state_dirty();
