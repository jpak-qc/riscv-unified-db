# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsetvl
long_name: Vector Set Vector Type and Vector Length
description: Set the vtype and vl CSRs, and write the new value of vl into rd.
definedBy:
  extension:
    name: Zve32x
assembly: xd, xs1, xs2
encoding:
  match: 1000000----------111-----1010111
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  XReg new_vtype = X[xs2];
  VectorState old_state = vector_state();
  if ((new_vtype[xlen() - 1] == 1'b1)        # software is setting the illegal bit
      || (new_vtype[xlen() - 2:8] != 0)      # reserved bits [XLEN-2:8] (full-width source)
      || (new_vtype[5] == 1)                 # reserved vsew encoding
      || (new_vtype[2:0] == 3'b100)          # reserved vlmul encoding
      || (xlen() == 32 && new_vtype[2:0] == 3'b101)) # reserved LMUL (mf8) in RV32
  {
    CSR[vtype].VILL = 1;
    CSR[vtype].VMA = 0;
    CSR[vtype].VTA = 0;
    CSR[vtype].VSEW = 0;
    CSR[vtype].VLMUL = 0;
    CSR[vl].VALUE = 0;
    X[xd] = 0;
    CSR[vstart].VALUE = 0;
  } else {
    # valid, do the write
    CSR[vtype].VILL = 0;
    CSR[vtype].VMA = new_vtype[7];
    CSR[vtype].VTA = new_vtype[6];
    CSR[vtype].VSEW = new_vtype[5:3];
    CSR[vtype].VLMUL = new_vtype[2:0];

    VectorState state = vector_state();

    # Check if SEW > ELEN * LMUL (fractional LMUL case) per RVV spec §3.4.2
    # For fractional LMUL, log2_sew + log2_lmul > log2(ELEN) means illegal
    if (VILL_SET_ON_RESERVED_VTYPE
        && state.lmul_type == VectorLmulType::Divide
        && state.log2_sew + state.log2_lmul > 7) {
      CSR[vtype].VILL = 1;
      CSR[vtype].VMA = 0;
      CSR[vtype].VTA = 0;
      CSR[vtype].VSEW = 0;
      CSR[vtype].VLMUL = 0;
      CSR[vl].VALUE = 0;
      X[xd] = 0;
      CSR[vstart].VALUE = 0;
    } else {
    XReg vlen = VLEN;
    XReg vlmax;
    if (state.lmul_type == VectorLmulType::Multiply) {
      vlmax = (vlen << state.log2_lmul) >> state.log2_sew;
    } else {
      # fractional LMUL divides VLMAX
      vlmax = (vlen >> state.log2_lmul) >> state.log2_sew;
    }
    XReg avl = X[xs1];
    XReg ceil_avl_over_two = (avl + 1) / 2;
    if (xs1 == 0 && xd != 0) {
      # rs1 == x0, rd != x0: set vl to VLMAX
      CSR[vl].VALUE = vlmax;
    } else if (xs1 == 0) {
      # rs1 == x0, rd == x0: keep existing vl, but check LMUL/SEW ratio
      XReg old_ratio = old_state.log2_sew - old_state.log2_lmul;
      XReg new_ratio = state.log2_sew - state.log2_lmul;
      if (new_ratio != old_ratio) {
        CSR[vtype].VILL = 1;
        CSR[vtype].VMA = 0;
        CSR[vtype].VTA = 0;
        CSR[vtype].VSEW = 0;
        CSR[vtype].VLMUL = 0;
        CSR[vl].VALUE = 0;
      }
      # else: keep vl unchanged
    } else if (avl <= vlmax) {
      CSR[vl].VALUE = avl;
    } else if (avl < 2 * vlmax) {
      if (RVV_VL_WHEN_AVL_LT_DOUBLE_VLMAX == "ceil(AVL/2)") {
        CSR[vl].VALUE = ceil_avl_over_two;
      } else if (RVV_VL_WHEN_AVL_LT_DOUBLE_VLMAX == "VLMAX") {
        CSR[vl].VALUE = vlmax;
      } else {
        unpredictable("Implementations may choose a custom value for vl in the case AVL < (2*VLMAX), so long as ceil(AVL/2) <= vl <= VLMAX");
      }
    } else {
      CSR[vl].VALUE = vlmax;
    }

    X[xd] = CSR[vl].VALUE;
    CSR[vstart].VALUE = 0;
    }  # close VILL_SET_ON_RESERVED_VTYPE else block
  }
