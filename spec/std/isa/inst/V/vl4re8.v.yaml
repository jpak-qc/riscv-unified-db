# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vl4re8.v
long_name: "Vector load 4 elements of 8 bits with register stride"
description: |
  Loads 4 segments of 8-bit elements from memory starting at address in xs1 register with stride in xs2, using vector mask vm, and stores results in vector register vd. The effective element width is 8 bits.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1)
encoding:
  match: 011000101000-----000-----0000111
  variables:
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
pseudoinstructions:
  - when: "true"
    to: vl4r.v vd, (xs1)
data_independent_timing: false
operation(): |
  check_v_ok($encoding);
  XReg virtual_address = X[xs1];
  U32 elems_per_reg = VLEN >> 3;
  U32 cur_elem = CSR[vstart].VALUE;
  U32 total_elem = 4 * elems_per_reg;
  if (cur_elem < total_elem) {
    for (U32 j = cur_elem / elems_per_reg; j < 4; j++) {
      U32 start_i = (j == cur_elem / elems_per_reg) ? cur_elem % elems_per_reg : 0;
      for (U32 i = start_i; i < elems_per_reg; i++) {
        U32 e = j * elems_per_reg + i;
        U32 start_bit = i * 8;
        V[vd + j][start_bit + 7:start_bit] = read_memory(8, virtual_address + e * 1, $encoding)[7:0];
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
