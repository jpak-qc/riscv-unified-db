# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vdiv.vv
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, vm
encoding:
  match: 100001-----------010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  Bits<128> int_min = -(128'b1 << (state.sew - 1));
  Bits<128> all_ones = (128'b1 << state.sew) - 1;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      Bits<128> dividend = $signed(v_elem_read(vs2, i, state.log2_sew)[state.sew - 1:0]);
      Bits<128> divisor  = $signed(v_elem_read(vs1, i, state.log2_sew)[state.sew - 1:0]);
      Bits<128> result;
      if (divisor == 0) {
        result = all_ones;
      } else if (dividend == int_min && divisor == all_ones) {
        result = int_min;
      } else {
        result = (dividend / divisor);
      }
      v_elem_write(vd, i, state.log2_sew, result[state.sew - 1:0]);
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
