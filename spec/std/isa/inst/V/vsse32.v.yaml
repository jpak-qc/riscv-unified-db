# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsse32.v
long_name: "Vector strided store 32-bit elements"
description: |
  Stores 32-bit elements from vector register vs2 to memory starting at address in xs1 register with stride, using vector mask vm. The effective element width is 32 bits.
definedBy:
  extension:
    name: Zve32x
assembly: vs3, (xs1), xs2, vm
encoding:
  match: 000010-----------110-----0100111
  variables:
    - name: vm
      location: 25-25
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vs3
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  XReg virtual_address = X[xs1];
  XReg stride = X[xs2];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      write_memory(32, virtual_address + i * stride, v_elem_read(vs3, i, 5)[31:0], $encoding);
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
