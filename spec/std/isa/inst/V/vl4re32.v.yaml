# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vl4re32.v
long_name: Vector load 4 elements of 32 bits with register stride
description: |
  Loads 4 segments of 32-bit elements from memory starting at address in xs1 register with stride in xs2, using vector mask vm, and stores results in vector register vd. The effective element width is 32 bits.
definedBy:
  extension:
    name: Zve32x
assembly: vd, (xs1)
encoding:
  match: 011000101000-----110-----0000111
  variables:
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok($encoding);
  XReg virtual_address = X[xs1];
  U32 bytes_per_reg = VLEN / 8;
  U32 cur_byte = CSR[vstart].VALUE;
  U32 total_bytes = 4 * bytes_per_reg;
  if (cur_byte < total_bytes) {
    for (U32 j = cur_byte / bytes_per_reg; j < 4; j++) {
      U32 start_i = (j == cur_byte / bytes_per_reg) ? cur_byte % bytes_per_reg : 0;
      for (U32 i = start_i; i < bytes_per_reg; i++) {
        U32 e = j * bytes_per_reg + i;
        V[vd + j][i*8+7:i*8] = read_memory(8, virtual_address + e, $encoding)[7:0];
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
