# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfrsqrt7.v
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vm
encoding:
  match: 010011------00100001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  RoundingMode rmode = rm_to_mode(CSR[fcsr].FRM, $encoding);
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      if (state.log2_sew == 6) {
        # f64 path deferred to Phase D (f64_rsqrt7 requires separate SEW=64 table lookup)
        Bits<64> a = v_elem_read(vs2, i, 6)[63:0];
        v_elem_write(vd, i, 6, {64'b0, a});
      } else {
        Bits<32> a = v_elem_read(vs2, i, 5)[31:0];
        v_elem_write(vd, i, 5, {96'b0, f32_rsqrt7(a, rmode)});
      }
    }
  }
  CSR[vstart].VALUE = 0;
  if (state.log2_sew != 6) {
    # f64 path is a deferred placeholder that performs no FP op, so it never
    # updates fflags and must not mark FP state dirty (Phase D will implement it).
    mark_f_state_dirty();
  }
  mark_v_state_dirty();
