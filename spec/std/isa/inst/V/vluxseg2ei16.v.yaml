# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: vluxseg2ei16.v
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1), vs2, vm
encoding:
  match: 001001-----------101-----0000111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> 4;
  XReg virtual_address = X[xs1];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      for (U32 j = 0; j < 2; j++) {
        U32 start_bit_f = (i % elems_per_reg) * 16;
        V[vd + j][start_bit_f + 15:start_bit_f] = read_memory(16, virtual_address + v_elem_read(vs2, i, 4)[15:0] + j * 2, $encoding)[15:0];
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
