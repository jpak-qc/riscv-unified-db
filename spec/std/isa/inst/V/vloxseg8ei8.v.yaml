# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: vloxseg8ei8.v
long_name: Vector ordered load 8 elements of 8 bits with index
description: |
  Loads 8 segments of 8-bit elements from memory using ordered access pattern with index register vs1, starting at address in xs1 register, using vector mask vm, and stores results in vector register vd. The effective element width is 8 bits.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1), vs2, vm
encoding:
  match: 111011-----------000-----0000111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> 3;
  XReg virtual_address = X[xs1];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      for (U32 j = 0; j < 8; j++) {
        U32 start_bit_f = (i % elems_per_reg) * 8;
        V[vd + j][start_bit_f + 7:start_bit_f] = read_memory(8, virtual_address + v_elem_read(vs2, i, 3)[7:0] + j * 1, $encoding)[7:0];
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
