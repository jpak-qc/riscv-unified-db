# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: vlseg8e32.v
long_name: Vector segmented load 8 elements of 32 bits
description: |
  Loads 8 segments of 32-bit elements from memory starting at address in xs1 register, using vector mask vm, and stores results in vector register vd. The effective element width is 32 bits regardless of SEW setting.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1), vm
encoding:
  match: 111000-00000-----110-----0000111
  variables:
    - name: vm
      location: 25-25
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 emul_reg = (state.lmul_type == VectorLmulType::Multiply) ? (32'b1 << state.log2_lmul) : 1;
  U32 elems_per_reg = VLEN >> 5;
  XReg virtual_address = X[xs1];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      CSR[vstart].VALUE = i;
      for (U32 j = 0; j < 8; j++) {
        U32 start_bit_f = (i % elems_per_reg) * 32;
        V[vd + j * emul_reg][start_bit_f + 31:start_bit_f] = read_memory(32, virtual_address + (i * 8 + j) * 4, $encoding)[31:0];
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
