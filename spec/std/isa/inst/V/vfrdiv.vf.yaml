# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfrdiv.vf
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zve32f
assembly: vd, vs2, fs1, vm
encoding:
  match: 100001-----------101-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  RoundingMode rmode = rm_to_mode(CSR[fcsr].FRM, $encoding);
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      if (state.log2_sew == 6) {
        Bits<64> a = v_elem_read(vs2, i, 6)[63:0];
        Bits<64> b = F[fs1][63:0];
        v_elem_write(vd, i, 6, {64'b0, f64_div(b, a, rmode)});
      } else {
        Bits<32> a = v_elem_read(vs2, i, 5)[31:0];
        Bits<32> b = F[fs1][31:0];
        if (implemented?(ExtensionName::D) && F[fs1][63:32] != 32'hffffffff) {
          b = SP_CANONICAL_NAN;
        }
        v_elem_write(vd, i, 5, {96'b0, f32_div(b, a, rmode)});
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_f_state_dirty();
  mark_v_state_dirty();
