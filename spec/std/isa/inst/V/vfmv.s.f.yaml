# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfmv.s.f
long_name: "Vector scalar to floating-point move"
description: |
  Moves scalar floating-point value from register fs1 to all elements of vector register vd, using vector mask vm. This operation broadcasts a scalar to a vector.
definedBy:
  extension:
    name: Zve32f
assembly: vd, fs1
encoding:
  match: 010000100000-----101-----1010111
  variables:
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  if (CSR[vl].VALUE > 0) {
    if (state.log2_sew == 6) {
      v_elem_write(vd, 0, 6, {64'b0, F[fs1][63:0]});
    } else {
      v_elem_write(vd, 0, 5, {96'b0, F[fs1][31:0]});
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
