# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: vloxseg8ei32.v
long_name: Vector ordered load 8 elements of 32 bits with index
description: |
  Loads 8 segments of 32-bit elements from memory using ordered access pattern with index register vs1, starting at address in xs1 register, using vector mask vm, and stores results in vector register vd. The effective element width is 32 bits.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1), vs2, vm
encoding:
  match: 111011-----------110-----0000111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  U32 emul_reg = (state.lmul_type == VectorLmulType::Multiply) ? (32'b1 << state.log2_lmul) : 1;
  U32 elems_per_reg_idx  = VLEN >> 5;   # index register group
  U32 elems_per_reg_data = VLEN >> state.log2_sew;   # data register group
  XReg virtual_address = X[xs1];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      XReg idx = v_elem_read(vs2, i, 5)[31:0];
      U32 reg_off = i / elems_per_reg_data;
      U32 start_bit_f = (i % elems_per_reg_data) * state.sew;
      CSR[vstart].VALUE = i;
      for (U32 j = 0; j < 8; j++) {
        XReg addr = virtual_address + idx + j * (state.sew / 8);
        if (state.sew == 8) {
          V[vd + j * emul_reg + reg_off][start_bit_f + 7:start_bit_f] = read_memory(8, addr, $encoding)[7:0];
        } else if (state.sew == 16) {
          V[vd + j * emul_reg + reg_off][start_bit_f + 15:start_bit_f] = read_memory(16, addr, $encoding)[15:0];
        } else if (state.sew == 32) {
          V[vd + j * emul_reg + reg_off][start_bit_f + 31:start_bit_f] = read_memory(32, addr, $encoding)[31:0];
        } else {
          V[vd + j * emul_reg + reg_off][start_bit_f + 63:start_bit_f] = read_memory(64, addr, $encoding)[63:0];
        }
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
