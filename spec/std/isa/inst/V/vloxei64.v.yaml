# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vloxei64.v
long_name: Vector ordered load 1 element of 64 bits with index
description: |
  Loads 1 segment of 64-bit elements from memory using ordered access pattern with index register vs1, starting at address in xs1 register, using vector mask vm, and stores results in vector register vd. The effective element width is 64 bits.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1), vs2, vm
encoding:
  match: 000011-----------111-----0000111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  VectorState state = vector_state();
  XReg virtual_address = X[xs1];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      # Index from vs2 at EEW=64 (log2_eew=6); data at SEW
      XReg idx = v_elem_read(vs2, i, 6)[63:0];
      Bits<128> data = {64'b0, read_memory(64, virtual_address + idx, $encoding)[63:0]};
      v_elem_write(vd, i, state.log2_sew, data);
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
