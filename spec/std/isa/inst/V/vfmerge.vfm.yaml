# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfmerge.vfm
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, fs1, v0
encoding:
  match: 0101110----------101-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  VectorState state = vector_state();
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (state.log2_sew == 6) {
      if (V[0][i] == 1'b1) {
        v_elem_write(vd, i, 6, {64'b0, F[fs1][63:0]});
      } else {
        v_elem_write(vd, i, 6, {64'b0, v_elem_read(vs2, i, 6)[63:0]});
      }
    } else {
      if (V[0][i] == 1'b1) {
        v_elem_write(vd, i, 5, {96'b0, F[fs1][31:0]});
      } else {
        v_elem_write(vd, i, 5, {96'b0, v_elem_read(vs2, i, 5)[31:0]});
      }
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
