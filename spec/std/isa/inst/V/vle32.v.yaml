# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vle32.v
long_name: Vector load 32-bit elements
description: |
  Loads 32-bit elements from memory starting at address in xs1 register, using vector mask vm, and stores results in vector register vd. The effective element width is 32 bits regardless of SEW setting.
definedBy:
  extension:
    name: Zve32x
assembly: vd, (xs1), vm
encoding:
  match: 000000-00000-----110-----0000111
  variables:
    - name: vm
      location: 25-25
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  XReg virtual_address = X[xs1];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      XReg elem_addr = virtual_address + i * 4;
      v_check_load_alignment(32, elem_addr);
      v_elem_write(vd, i, 5, {96'b0, read_memory(32, elem_addr, $encoding)[31:0]});
    }
  }
  CSR[vstart].VALUE = 0;
  mark_v_state_dirty();
