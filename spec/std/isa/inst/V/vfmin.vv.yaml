# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfmin.vv
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, vm
encoding:
  match: 000100-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_v_ok_vtype($encoding);
  check_f_ok($encoding);
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (v_mask_elem_active?(vm, i)) {
      Bits<32> a = v_elem_read(vs2, i, 5)[31:0];
      Bits<32> b = v_elem_read(vs1, i, 5)[31:0];
      Bits<32> res;
      if (is_sp_nan?(a) && is_sp_nan?(b)) {
        if (is_sp_signaling_nan?(a) || is_sp_signaling_nan?(b)) { set_fp_flag(FpFlag::NV); }
        res = SP_CANONICAL_NAN;
      } else if (is_sp_nan?(a)) {
        if (is_sp_signaling_nan?(a)) { set_fp_flag(FpFlag::NV); }
        res = b;
      } else if (is_sp_nan?(b)) {
        if (is_sp_signaling_nan?(b)) { set_fp_flag(FpFlag::NV); }
        res = a;
      } else {
        res = f32_lt?(a, b, true) ? a : b;
      }
      v_elem_write(vd, i, 5, {96'b0, res});
    }
  }
  CSR[vstart].VALUE = 0;
  mark_f_state_dirty();
  mark_v_state_dirty();
