$schema: "inst_schema.json#"
kind: instruction
name: amocas.q.rl
long_name: Atomic compare-and-swap quadword (release)
description: |
  Atomically with release ordering:

    * Load the quadword at address _xs1_
    * Write the loaded value into the register pair _xd_, _xd+1_
    * Compare the loaded value with the register pair _xd_, _xd+1_
    * If equal, write the register pair _xs2_, _xs2+1_ to the address in _xs1_
definedBy:
  allOf:
    - extension:
        name: Zacas
    - xlen: 64
assembly: xd, xs2, (xs1)
encoding:
  match: 0010101----------100-----0101111
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  if (!implemented?(ExtensionName::Zacas)) {
    raise (ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  XReg virtual_address = X[xs1];
  if ((xd[0] == 1'b1) || (xs2[0] == 1'b1)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  XReg expected_low = X[xd];
  XReg expected_high = X[xd + 1];
  XReg replacement_low = X[xs2];
  XReg replacement_high = (xs2 == 0) ? 0 : X[xs2 + 1];
  XReg physical_address = amocas_physical_address(128, virtual_address, $encoding);
  XReg loaded_low = read_physical_memory(64, physical_address);
  XReg loaded_high = read_physical_memory(64, physical_address + 8);

  if ((loaded_low == expected_low) && (loaded_high == expected_high)) {
    write_physical_memory(64, physical_address, replacement_low);
    write_physical_memory(64, physical_address + 8, replacement_high);
  }

  if (xd != 0) {
    X[xd] = loaded_low;
    X[xd + 1] = loaded_high;
  }

  memory_model_release();
