# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvtmod.w.d
long_name: Floating-Point Convert Double-Precision to Word with Modulo
description: |
  The `fcvtmod.w.d` instruction always rounds towards zero. Bits 31:0 are taken from the rounded, unbounded
  two's complement result, then sign-extended to XLEN bits and written to integer register `xd`. ±∞ and
  NaN are converted to zero.

  Floating-point exception flags are raised the same as they would be for `fcvt.w.d` with the same input
  operand.

  This instruction is only provided if the D extension is implemented. It is encoded like `fcvt.w.d`, but
  with the `xs2` field set to 8 and the `rm` field set to 1 (RTZ). Other `rm` values are reserved.
definedBy:
  extension:
    allOf:
      - name: D
      - name: Zfa
assembly: xd, fs1, rm
encoding:
  match: 110000101000-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
      not: [0, 2, 3, 4, 5, 6, 7]
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  # Always rounds toward zero (RTZ), modulo 2^32 semantics
  Bits<1>  sign = signF64UI(F[fs1]);
  Bits<16> exp  = expF64UI(F[fs1]);
  Bits<64> sig  = fracF64UI(F[fs1]);

  if (exp == 11'h7FF) {
    # Infinity and NaN convert to zero; set NV
    if (sig != 0) {
      set_fp_flag(FpFlag::NV);
    } else {
      set_fp_flag(FpFlag::NV);
    }
    X[xd] = 0;
  } else if (exp == 0) {
    # Zero or subnormal - result is zero
    if (sig != 0) {
      set_fp_flag(FpFlag::NX);
    }
    X[xd] = 0;
  } else {
    sig = sig | 64'h0010000000000000;
    Bits<16> shiftDist = exp - 16'h0433;
    Bits<64> result;
    if ($signed(shiftDist) >= 0s) {
      # |value| >= 2^52, shift left and take lower 32 bits
      result = sig << shiftDist;
    } else {
      # Round toward zero - truncate fractional bits
      Bits<16> rightShift = -shiftDist;
      Bits<64> roundedSig;
      if ($signed(rightShift) >= 64s) {
        set_fp_flag(FpFlag::NX);
        roundedSig = 0;
      } else {
        Bits<64> fracBits = sig & ((64'h1 << rightShift) - 1);
        roundedSig = sig >> rightShift;
        if (fracBits != 0) { set_fp_flag(FpFlag::NX); }
      }
      result = roundedSig;
    }
    # Take lower 32 bits and sign-extend
    Bits<32> result32 = result[31:0];
    Bits<32> signed_result = (sign == 1) ? -result32 : result32;
    X[xd] = $signed(signed_result);
  }
