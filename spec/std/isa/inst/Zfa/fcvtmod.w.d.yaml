# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvtmod.w.d
long_name: Floating-Point Convert Double-Precision to Word with Modulo
description: |
  The `fcvtmod.w.d` instruction always rounds towards zero. Bits 31:0 are taken from the rounded, unbounded
  two's complement result, then sign-extended to XLEN bits and written to integer register `xd`. ±∞ and
  NaN are converted to zero.

  Floating-point exception flags are raised the same as they would be for `fcvt.w.d` with the same input
  operand.

  This instruction is only provided if the D extension is implemented. It is encoded like `fcvt.w.d`, but
  with the `xs2` field set to 8 and the `rm` field set to 1 (RTZ). Other `rm` values are reserved.
definedBy:
  extension:
    allOf:
      - name: D
      - name: Zfa
assembly: xd, fs1, rm
encoding:
  match: 110000101000-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
      not: [0, 2, 3, 4, 5, 6, 7]
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  Bits<1>  sign = signF64UI(F[fs1]);
  Bits<16> exp  = expF64UI(F[fs1]);
  Bits<64> sig  = fracF64UI(F[fs1]);

  if (exp == 11'h7FF) {
    X[xd] = 0;
  } else if (exp == 0) {
    X[xd] = 0;
  } else {
    sig = sig | 64'h0010000000000000;
    Bits<32> result32;
    if (exp >= 16'h0433) {
      Bits<16> leftShift = exp - 16'h0433;
      if (leftShift >= 32) {
        result32 = 0;
      } else {
        result32 = sig[31:0];
        for (U32 i = 0; i < leftShift; i++) {
          result32 = result32 `<< 1;
        }
      }
    } else {
      Bits<16> rightShift = 16'h0433 - exp;
      Bits<64> roundedSig;
      if (rightShift >= 16'h0040) {
        roundedSig = 0;
      } else {
        roundedSig = sig >> rightShift;
      }
      result32 = roundedSig[31:0];
    }
    Bits<32> signed_result = (sign == 1) ? -result32 : result32;
    X[xd] = $signed(signed_result);
  }

  # Raise the flags required by FCVT.W.D with RTZ without constraining the
  # unbounded conversion used for the FCVTMOD result.
  if (exp == 11'h7FF) {
    set_fp_flag(FpFlag::NV);
  } else if (exp == 0) {
    if (sig != 0) { set_fp_flag(FpFlag::NX); }
  } else {
    Bits<64> normalizedSig = sig | 64'h0010000000000000;
    if (exp > 16'h041E) {
      set_fp_flag(FpFlag::NV);
    } else if (exp == 16'h041E) {
      Bits<64> integerMagnitude = normalizedSig >> 21;
      if ((sign == 0) || (integerMagnitude > 64'h0000000080000000)) {
        set_fp_flag(FpFlag::NV);
      } else if ((normalizedSig & 64'h00000000001FFFFF) != 0) {
        set_fp_flag(FpFlag::NX);
      }
    } else {
      Bits<16> rightShiftForFlags = 16'h0433 - exp;
      if (rightShiftForFlags >= 64) {
        set_fp_flag(FpFlag::NX);
      } else {
        Bits<64> discardedBits = normalizedSig & ((64'h1 << rightShiftForFlags) - 1);
        if (discardedBits != 0) { set_fp_flag(FpFlag::NX); }
      }
    }
  }
