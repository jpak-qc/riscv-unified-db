# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: fmaxm.s
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zfa
assembly: fd, fs1, fs2
encoding:
  match: 0010100----------011-----1010011
  variables:
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  Bits<32> value_a = f32_operand(F[fs1]);
  Bits<32> value_b = f32_operand(F[fs2]);

  if (is_sp_nan?(value_a) || is_sp_nan?(value_b)) {
    if (is_sp_signaling_nan?(value_a) || is_sp_signaling_nan?(value_b)) {
      set_fp_flag(FpFlag::NV);
    }
    F[fd] = f32_result(SP_CANONICAL_NAN);
  } else {
    Boolean sign_a = value_a[31] == 1;
    Boolean sign_b = value_b[31] == 1;
    Boolean a_lt_b;
    if (sign_a != sign_b) {
      a_lt_b = sign_a;
    } else {
      a_lt_b = (value_a != value_b) && (sign_a != (value_a < value_b));
    }
    F[fd] = f32_result(a_lt_b ? value_b : value_a);
  }
  mark_f_state_dirty();
