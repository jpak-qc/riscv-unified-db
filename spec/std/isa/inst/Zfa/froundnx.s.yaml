# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: froundnx.s
long_name: Floating-point Round Single-precision to Integer with Inexact
description: |
  No description available.
definedBy:
  extension:
    name: Zfa
assembly: fd, fs1, rm
encoding:
  match: 010000000101-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  RoundingMode rounding_mode = rm_to_mode(rm, $encoding);
  Bits<32> input = f32_operand(F[fs1]);
  Bits<32> result = round_f32_to_integral(input, rounding_mode);
  if (!is_sp_nan?(input) && (result != input)) {
    set_fp_flag(FpFlag::NX);
  }
  F[fd] = f32_result(result);
  mark_f_state_dirty();
