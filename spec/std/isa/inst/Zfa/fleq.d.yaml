# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fleq.d
long_name: Floating-Point Less Than or Equal Quiet Double-Precision
description: |
  The `fleq.d` instruction is defined like the `fle.d` instruction, except that quiet NaN inputs do not cause
  the invalid operation exception flag to be set.
definedBy:
  extension:
    allOf:
      - name: D
      - name: Zfa
assembly: xd, fs1, fs2
encoding:
  match: 1010001----------100-----1010011
  variables:
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);

  Bits<64> dp_value_a = F[fs1];
  Bits<64> dp_value_b = F[fs2];

  if (is_dp_nan?(dp_value_a) || is_dp_nan?(dp_value_b)) {
    # Quiet comparison: only set NV for signaling NaN
    if (is_dp_signaling_nan?(dp_value_a) || is_dp_signaling_nan?(dp_value_b)) {
      set_fp_flag(FpFlag::NV);
    }
    X[xd] = 0;
  } else {
    Boolean sign_a = dp_value_a[63] == 1;
    Boolean sign_b = dp_value_b[63] == 1;

    Boolean a_eq_b =
      (dp_value_a == dp_value_b)
      || ((dp_value_a | dp_value_b)[62:0] == 0);

    Boolean a_lt_b;
    if (sign_a != sign_b) {
      a_lt_b = sign_a && ((dp_value_a[62:0] | dp_value_b[62:0]) != 0);
    } else {
      a_lt_b = (dp_value_a != dp_value_b) && (sign_a != (dp_value_a < dp_value_b));
    }

    X[xd] = (a_lt_b || a_eq_b) ? 1 : 0;
  }
