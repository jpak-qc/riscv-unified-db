# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsm4r.vs
long_name: Vector SM4 round function with scalar
description: |
  Performs SM4 round function operation on vector register vs2 using scalar register rs1, storing results in vector register vd according to mask vm. This is used in SM4 block cipher encryption/decryption rounds.
definedBy:
  extension:
    name: Zvksed
assembly: vd, vs2
encoding:
  match: 1010011-----10000010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  VectorState state = vector_state();
  U32 destination_registers = vector_register_group_registers(state);
  U32 key_registers = vector_element_group_registers(128);
  U32 destination = vd;
  U32 key = vs2;
  if (state.sew != 32 || !vector_element_group_legal(state, 128, 4) ||
      (destination < key + key_registers && key < destination + destination_registers)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  Bits<128> round_keys = vector_read_eg128(vs2, 0);
  for (U32 group = CSR[vstart].VALUE / 4; group < CSR[vl].VALUE / 4; group++) {
    U32 element = group * 4;
    vector_write_eg128(vd, element,
      crypto_sm4_rounds(vector_read_eg128(vd, element), round_keys));
  }

  CSR[vstart].VALUE = 0;
