# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vclmul.vv
long_name: Vector carry-less multiply
description: |
  Performs a carry-less multiply operation on each element in vector register vs2 with the corresponding element in vector register vs1, storing results in vector register vd according to mask vm. This is useful for cryptographic operations.
definedBy:
  extension:
    name: Zvbc
assembly: vd, vs2, vs1, vm
encoding:
  match: 001100-----------010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  VectorState state = vector_state();
  if (state.sew != 64) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;
      Bits<128> product = crypto_clmul64(
        V[vs2 + reg_off][end_bit:start_bit],
        V[vs1 + reg_off][end_bit:start_bit]);
      V[vd + reg_off][end_bit:start_bit] = product[63:0];
    }
  }

  CSR[vstart].VALUE = 0;
